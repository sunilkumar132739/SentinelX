<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelX | Attack Surface Platform</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid #334155; }
    </style>
</head>
<body class="min-h-screen p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('new');
            const [target, setTarget] = useState('scanme.nmap.org');
            const [scheduleInterval, setScheduleInterval] = useState(60);
            const [isScanning, setIsScanning] = useState(false);
            const [results, setResults] = useState(null);
            const [alertMsg, setAlertMsg] = useState(null);
            
            const [history, setHistory] = useState([]);

            const fetchHistory = async () => {
                const res = await fetch('http://localhost:8000/history');
                setHistory(await res.json());
            };

            useEffect(() => { if (activeTab === 'history') fetchHistory(); }, [activeTab]);

            // Manual Scan
            const handleScan = async (e) => {
                e.preventDefault();
                setIsScanning(true);
                setResults(null);
                setAlertMsg(null);
                try {
                    const res = await fetch(`http://localhost:8000/scan/${target}`);
                    setResults(await res.json());
                } catch (err) {
                    setAlertMsg("Error connecting to API");
                } finally {
                    setIsScanning(false);
                }
            };

            // NEW PHASE 4: Schedule Scan
            const handleSchedule = async (e) => {
                e.preventDefault();
                setAlertMsg(null);
                try {
                    const res = await fetch('http://localhost:8000/schedule', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ target: target, minutes: parseInt(scheduleInterval) })
                    });
                    const data = await res.json();
                    setAlertMsg({ type: 'success', text: data.message });
                } catch (err) {
                    setAlertMsg({ type: 'error', text: "Failed to schedule task." });
                }
            };

            const viewHistoricalScan = async (id) => {
                const res = await fetch(`http://localhost:8000/history/${id}`);
                setResults(await res.json());
                setActiveTab('new');
            };

            return (
                <div className="max-w-5xl mx-auto">
                    <div className="flex items-center space-x-4 mb-8">
                        <i className="fa-solid fa-shield-halved text-4xl text-blue-500"></i>
                        <div>
                            <h1 className="text-3xl font-bold tracking-tight">SentinelX</h1>
                            <p className="text-slate-400 text-sm">Automated Attack Surface Assessment</p>
                        </div>
                    </div>

                    <div className="flex space-x-2 mb-6 border-b border-slate-700 pb-px">
                        <button onClick={() => setActiveTab('new')} className={`px-4 py-2 font-semibold rounded-t-lg ${activeTab === 'new' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Scanner</button>
                        <button onClick={() => setActiveTab('history')} className={`px-4 py-2 font-semibold rounded-t-lg ${activeTab === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Scan History</button>
                    </div>

                    {alertMsg && (
                        <div className={`p-4 mb-6 rounded-lg ${alertMsg.type === 'success' ? 'bg-green-500/20 text-green-400 border border-green-500' : 'bg-red-500/20 text-red-400 border border-red-500'}`}>
                            {alertMsg.text}
                        </div>
                    )}

                    {activeTab === 'new' && (
                        <>
                            <div className="glass-panel rounded-xl p-6 mb-8 shadow-xl">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    
                                    {/* Manual Scan Box */}
                                    <div className="border-r border-slate-600 pr-6">
                                        <h3 className="text-lg font-semibold mb-4"><i className="fa-solid fa-hand-pointer mr-2"></i>Run Manual Scan</h3>
                                        <form onSubmit={handleScan} className="space-y-4">
                                            <div>
                                                <label className="block text-xs text-slate-400 uppercase mb-2">Target IP/Domain</label>
                                                <input type="text" value={target} onChange={(e) => setTarget(e.target.value)} className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white" />
                                            </div>
                                            <button type="submit" disabled={isScanning} className="w-full py-2 bg-blue-600 hover:bg-blue-500 rounded font-bold">
                                                {isScanning ? "Scanning..." : "Launch Scan Now"}
                                            </button>
                                        </form>
                                    </div>

                                    {/* Automated Schedule Box */}
                                    <div className="pl-6">
                                        <h3 className="text-lg font-semibold mb-4 text-purple-400"><i className="fa-solid fa-clock mr-2"></i>Automated Monitoring</h3>
                                        <form onSubmit={handleSchedule} className="space-y-4">
                                            <div>
                                                <label className="block text-xs text-slate-400 uppercase mb-2">Scan Interval (Minutes)</label>
                                                <input type="number" min="1" value={scheduleInterval} onChange={(e) => setScheduleInterval(e.target.value)} className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white" />
                                            </div>
                                            <button type="submit" className="w-full py-2 bg-purple-600 hover:bg-purple-500 rounded font-bold">
                                                Schedule Background Scan
                                            </button>
                                        </form>
                                    </div>

                                </div>
                            </div>

                            {/* Results Display */}
                            {results && (
                                <div className="animate-fade-in-up">
                                    <h2 className="text-xl font-semibold mb-4 border-b border-slate-700 pb-2">Results for {results.target_ip}</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {results.services.map((svc, i) => (
                                            <div key={i} className="glass-panel p-5 rounded-lg border-l-4 border-l-blue-500">
                                                <div className="font-mono text-lg font-bold">Port {svc.port}</div>
                                                <div className="text-sm text-slate-400">{svc.service} {svc.version_info}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </>
                    )}

                    {activeTab === 'history' && (
                        <div className="glass-panel rounded-xl shadow-xl overflow-hidden p-4">
                            <table className="w-full text-left">
                                <thead><tr className="border-b border-slate-700 text-slate-400"><th className="pb-2">ID</th><th className="pb-2">Target</th><th className="pb-2">Date</th><th className="pb-2">Actions</th></tr></thead>
                                <tbody>
                                    {history.map(r => (
                                        <tr key={r.id} className="border-b border-slate-800">
                                            <td className="py-3">#{r.id}</td><td className="py-3">{r.target}</td><td className="py-3">{new Date(r.time).toLocaleString()}</td>
                                            <td><button onClick={() => viewHistoricalScan(r.id)} className="bg-slate-700 px-3 py-1 rounded text-sm">View</button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
