<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelX | Secure Attack Surface Platform</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid #334155; }
    </style>
</head>
<body class="min-h-screen p-8 flex flex-col items-center justify-center">
    <div id="root" class="w-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // --- Auth State ---
            const [token, setToken] = useState(localStorage.getItem('token'));
            const [authMode, setAuthMode] = useState('login'); // 'login' or 'register'
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState(null);

            // --- App State ---
            const [activeTab, setActiveTab] = useState('new');
            const [target, setTarget] = useState('scanme.nmap.org');
            const [isScanning, setIsScanning] = useState(false);
            const [results, setResults] = useState(null);
            const [history, setHistory] = useState([]);

            // Helper to get headers with JWT token
            const getAuthHeaders = () => ({
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            });

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError(null);
                try {
                    if (authMode === 'register') {
                        const res = await fetch('http://localhost:8000/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, password })
                        });
                        if (!res.ok) throw new Error("Registration failed. Username might exist.");
                        setAuthMode('login');
                        setAuthError("Registration successful! Please log in.");
                    } else {
                        // Login uses form-urlencoded format required by OAuth2
                        const formData = new URLSearchParams();
                        formData.append('username', username);
                        formData.append('password', password);
                        
                        const res = await fetch('http://localhost:8000/token', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: formData
                        });
                        if (!res.ok) throw new Error("Invalid username or password");
                        const data = await res.json();
                        setToken(data.access_token);
                        localStorage.setItem('token', data.access_token);
                    }
                } catch (err) {
                    setAuthError(err.message);
                }
            };

            const handleLogout = () => {
                setToken(null);
                localStorage.removeItem('token');
                setResults(null);
            };

            const fetchHistory = async () => {
                const res = await fetch('http://localhost:8000/history', { headers: getAuthHeaders() });
                if (res.status === 401) return handleLogout();
                setHistory(await res.json());
            };

            useEffect(() => { if (token && activeTab === 'history') fetchHistory(); }, [activeTab, token]);

            const handleScan = async (e) => {
                e.preventDefault();
                setIsScanning(true);
                try {
                    const res = await fetch(`http://localhost:8000/scan/${target}`, { headers: getAuthHeaders() });
                    if (res.status === 401) return handleLogout();
                    setResults(await res.json());
                } catch (err) {
                    alert("Scan failed");
                } finally {
                    setIsScanning(false);
                }
            };

            // --- Render Login Screen if not authenticated ---
            if (!token) {
                return (
                    <div className="max-w-md mx-auto glass-panel p-8 rounded-xl shadow-xl mt-12 w-full">
                        <div className="text-center mb-8">
                            <i className="fa-solid fa-shield-halved text-5xl text-blue-500 mb-4"></i>
                            <h1 className="text-2xl font-bold">SentinelX Identity</h1>
                            <p className="text-slate-400 text-sm">Sign in to access the platform</p>
                        </div>
                        {authError && <div className="bg-red-500/20 text-red-400 p-3 rounded mb-4 text-sm text-center">{authError}</div>}
                        <form onSubmit={handleAuth} className="space-y-4">
                            <div>
                                <label className="block text-xs uppercase text-slate-400 mb-1">Username</label>
                                <input type="text" value={username} onChange={e => setUsername(e.target.value)} required className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white" />
                            </div>
                            <div>
                                <label className="block text-xs uppercase text-slate-400 mb-1">Password</label>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white" />
                            </div>
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded font-bold transition">
                                {authMode === 'login' ? 'Secure Login' : 'Create Account'}
                            </button>
                        </form>
                        <div className="text-center mt-4 text-sm text-slate-400">
                            {authMode === 'login' ? "Don't have an account? " : "Already have an account? "}
                            <button onClick={() => {setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(null);}} className="text-blue-400 hover:underline">
                                {authMode === 'login' ? 'Register' : 'Login'}
                            </button>
                        </div>
                    </div>
                );
            }

            // --- Render Main Dashboard if authenticated ---
            return (
                <div className="max-w-5xl mx-auto w-full">
                    <div className="flex items-center justify-between mb-8">
                        <div className="flex items-center space-x-4">
                            <i className="fa-solid fa-shield-halved text-4xl text-blue-500"></i>
                            <div>
                                <h1 className="text-3xl font-bold tracking-tight">SentinelX</h1>
                                <p className="text-slate-400 text-sm">Automated Attack Surface Assessment</p>
                            </div>
                        </div>
                        <button onClick={handleLogout} className="text-sm bg-slate-800 hover:bg-slate-700 border border-slate-600 px-4 py-2 rounded text-slate-300">
                            <i className="fa-solid fa-right-from-bracket mr-2"></i>Logout
                        </button>
                    </div>

                    <div className="flex space-x-2 mb-6 border-b border-slate-700 pb-px">
                        <button onClick={() => setActiveTab('new')} className={`px-4 py-2 font-semibold rounded-t-lg ${activeTab === 'new' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Scanner</button>
                        <button onClick={() => setActiveTab('history')} className={`px-4 py-2 font-semibold rounded-t-lg ${activeTab === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Scan History</button>
                    </div>

                    {activeTab === 'new' && (
                        <div className="glass-panel rounded-xl p-6 mb-8 shadow-xl">
                            <h3 className="text-lg font-semibold mb-4"><i className="fa-solid fa-crosshairs mr-2"></i>Target Acquisition</h3>
                            <form onSubmit={handleScan} className="flex space-x-4">
                                <input type="text" value={target} onChange={(e) => setTarget(e.target.value)} className="flex-grow bg-slate-800 border border-slate-600 rounded p-3 text-white" />
                                <button type="submit" disabled={isScanning} className="bg-blue-600 hover:bg-blue-500 px-8 py-3 rounded font-bold">
                                    {isScanning ? "Scanning..." : "Launch Scan"}
                                </button>
                            </form>
                            
                            {results && (
                                <div className="mt-8 border-t border-slate-700 pt-6">
                                    <h2 className="text-xl font-bold mb-4 text-green-400">Scan Complete: {results.target_ip}</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {results.services.map((svc, i) => (
                                            <div key={i} className="bg-slate-800 p-4 rounded border-l-4 border-l-blue-500">
                                                <div className="font-bold">Port {svc.port}</div>
                                                <div className="text-sm text-slate-400">{svc.service} {svc.version_info}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {activeTab === 'history' && (
                        <div className="glass-panel rounded-xl shadow-xl overflow-hidden p-4">
                            <table className="w-full text-left">
                                <thead><tr className="border-b border-slate-700 text-slate-400"><th className="pb-2">Target</th><th className="pb-2">Date</th></tr></thead>
                                <tbody>
                                    {history.map(r => (
                                        <tr key={r.id} className="border-b border-slate-800">
                                            <td className="py-3 font-mono">{r.target}</td><td className="py-3 text-slate-400">{new Date(r.time).toLocaleString()}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
