<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="darkreader-lock">
    <title>SentinelX | Advanced Threat Surface/title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow: hidden; 
            margin: 0;
            background-color: #000;
        }
        
        * { box-sizing: border-box; transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; }

        /* --- THEME VARIABLES --- */
        .dark-mode {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --panel-bg: rgba(40, 40, 40, 0.4);
            --panel-border: rgba(255, 255, 255, 0.15);
            --panel-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
            --sub-panel-bg: rgba(0, 0, 0, 0.4);
            --input-bg: rgba(0, 0, 0, 0.3);
            --input-border: rgba(255, 255, 255, 0.2);
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-hover: rgba(255, 255, 255, 0.2);
            --gradient-1: rgba(59, 130, 246, 0.15);
            --gradient-2: rgba(139, 92, 246, 0.15);
            --profile-banner: linear-gradient(to right, #1f2937, #111827);
            --profile-avatar-bg: #000000;
        }

        .light-mode {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --panel-bg: rgba(255, 255, 255, 0.65);
            --panel-border: rgba(0, 0, 0, 0.1);
            --panel-shadow: 0 20px 40px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.6);
            --sub-panel-bg: rgba(255, 255, 255, 0.5);
            --input-bg: rgba(255, 255, 255, 0.6);
            --input-border: rgba(0, 0, 0, 0.15);
            --btn-bg: rgba(0, 0, 0, 0.05);
            --btn-hover: rgba(0, 0, 0, 0.1);
            --gradient-1: rgba(59, 130, 246, 0.1);
            --gradient-2: rgba(139, 92, 246, 0.1);
            --profile-banner: linear-gradient(to right, #e2e8f0, #cbd5e1);
            --profile-avatar-bg: #ffffff;
        }

        /* --- BULLETPROOF GLASS CLASSES --- */
        .theme-container {
            background-color: var(--bg-color) !important;
            background-image: radial-gradient(circle at 20% 30%, var(--gradient-1), transparent 50%), radial-gradient(circle at 80% 70%, var(--gradient-2), transparent 50%) !important;
            color: var(--text-main) !important;
            -webkit-text-fill-color: var(--text-main) !important;
        }

        .glass-panel {
            background: var(--panel-bg) !important;
            border: 1px solid var(--panel-border) !important;
            box-shadow: var(--panel-shadow) !important;
            border-radius: 32px;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            color: var(--text-main) !important;
            -webkit-text-fill-color: var(--text-main) !important;
        }

        .glass-sub-panel {
            background: var(--sub-panel-bg) !important;
            border: 1px solid var(--panel-border) !important;
            border-radius: 16px;
            padding: 1rem;
            color: var(--text-main) !important;
            -webkit-text-fill-color: var(--text-main) !important;
        }

        .glass-input {
            background: var(--input-bg) !important;
            border: 1px solid var(--input-border) !important;
            border-radius: 16px;
            color: var(--text-main) !important;
            -webkit-text-fill-color: var(--text-main) !important;
            width: 100%;
        }
        
        .glass-input:focus {
            outline: none;
            border-color: var(--text-muted) !important;
        }

        .glass-input::placeholder { 
            color: var(--text-muted) !important; 
            -webkit-text-fill-color: var(--text-muted) !important;
        }

        .glass-btn {
            background: var(--btn-bg) !important;
            border: 1px solid var(--input-border) !important;
            border-radius: 16px;
            color: var(--text-main) !important;
            -webkit-text-fill-color: var(--text-main) !important;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        
        .glass-btn:hover {
            background: var(--btn-hover) !important;
            transform: translateY(-1px);
        }

        .glass-btn:active {
            transform: translateY(1px);
        }

        /* Typography & Utilities */
        .text-main { color: var(--text-main) !important; -webkit-text-fill-color: var(--text-main) !important; }
        .text-muted { color: var(--text-muted) !important; -webkit-text-fill-color: var(--text-muted) !important; }
        .border-theme { border-color: var(--panel-border) !important; }

        /* Semantic Overrides (Forces color even if browser tries to invert) */
        .text-red-500 { color: #ef4444 !important; -webkit-text-fill-color: #ef4444 !important; }
        .text-green-500 { color: #22c55e !important; -webkit-text-fill-color: #22c55e !important; }
        .text-yellow-500 { color: #eab308 !important; -webkit-text-fill-color: #eab308 !important; }
        .bg-red-500 { background-image: linear-gradient(0deg, #ef4444, #ef4444) !important; -webkit-text-fill-color: #ffffff !important; }
        .bg-green-500 { background-image: linear-gradient(0deg, #22c55e, #22c55e) !important; -webkit-text-fill-color: #ffffff !important; }
        
        .bg-red-500\/20 { background-image: linear-gradient(0deg, rgba(239,68,68,0.15), rgba(239,68,68,0.15)) !important; }
        .bg-green-500\/20 { background-image: linear-gradient(0deg, rgba(34,197,94,0.15), rgba(34,197,94,0.15)) !important; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            // Theme State
            const [isLightMode, setIsLightMode] = useState(() => localStorage.getItem('themeMode') === 'light');
            
            // UI State
            const [language, setLanguage] = useState('en');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            
            // App State
            const [token, setToken] = useState(localStorage.getItem('token'));
            const [authMode, setAuthMode] = useState('login');
            const [username, setUsername] = useState(localStorage.getItem('username') || '');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState(null);
            
            const [profileData, setProfileData] = useState(null);
            const [activeTab, setActiveTab] = useState('new');
            const [target, setTarget] = useState('scanme.nmap.org');
            const [scheduleType, setScheduleType] = useState('interval');
            const [scheduleInterval, setScheduleInterval] = useState(60);
            const [scheduleDateTime, setScheduleDateTime] = useState('');
            const [activeSchedules, setActiveSchedules] = useState([]);
            const [isScanning, setIsScanning] = useState(false);
            const [results, setResults] = useState(null);
            const [alertMsg, setAlertMsg] = useState(null);
            const [history, setHistory] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');

            useEffect(() => {
                localStorage.setItem('themeMode', isLightMode ? 'light' : 'dark');
            }, [isLightMode]);

            const getAuthHeaders = () => ({ 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' });

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError(null);
                try {
                    if (authMode === 'register') {
                        const res = await fetch('http://localhost:8000/register', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, email, password })
                        });
                        if (!res.ok) throw new Error((await res.json()).detail || "Registration failed.");
                        setAuthMode('login');
                        setAuthError("Registration successful! Please log in.");
                    } else {
                        const formData = new URLSearchParams();
                        formData.append('username', username);
                        formData.append('password', password);
                        const res = await fetch('http://localhost:8000/token', {
                            method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: formData
                        });
                        if (!res.ok) throw new Error("Invalid credentials or Server is down.");
                        const data = await res.json();
                        setToken(data.access_token);
                        localStorage.setItem('token', data.access_token);
                        localStorage.setItem('username', username);
                    }
                } catch (err) { setAuthError(err.message); }
            };

            const handleLogout = () => {
                setToken(null); setProfileData(null);
                localStorage.removeItem('token'); localStorage.removeItem('username');
                setResults(null); setActiveTab('new');
            };

            const fetchProfile = async () => {
                try {
                    const res = await fetch('http://localhost:8000/users/me', { headers: getAuthHeaders() });
                    if (res.status === 401) return handleLogout();
                    setProfileData(await res.json());
                } catch (err) {}
            };

            const fetchHistory = async () => {
                const res = await fetch('http://localhost:8000/history', { headers: getAuthHeaders() });
                if (res.status === 401) return handleLogout();
                setHistory(await res.json());
            };

            const fetchSchedules = async () => {
                const res = await fetch('http://localhost:8000/schedules', { headers: getAuthHeaders() });
                if (res.ok) setActiveSchedules(await res.json());
            };

            useEffect(() => { if (token) fetchProfile(); }, [token]);
            useEffect(() => { 
                if (token) {
                    if (['history', 'automated', 'search'].includes(activeTab)) fetchHistory();
                    if (activeTab === 'schedule') fetchSchedules();
                }
            }, [activeTab, token]);

            const handleAvatarUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = async () => {
                    try {
                        const res = await fetch('http://localhost:8000/users/me/avatar', {
                            method: 'PUT', headers: getAuthHeaders(), body: JSON.stringify({ avatar_data: reader.result })
                        });
                        if (res.ok) { fetchProfile(); setAlertMsg({ type: 'success', text: "Profile picture updated!" }); }
                    } catch (err) {}
                };
                reader.readAsDataURL(file);
            };

            const handleScan = async (e) => {
                e.preventDefault();
                setIsScanning(true); setResults(null); setAlertMsg(null);
                try {
                    const res = await fetch(`http://localhost:8000/scan/${target}`, { headers: getAuthHeaders() });
                    if (res.status === 401) return handleLogout();
                    setResults(await res.json());
                } catch (err) { setAlertMsg({ type: 'error', text: "Scan failed to execute." }); } 
                finally { setIsScanning(false); }
            };

            const handleSchedule = async (e) => {
                e.preventDefault();
                setAlertMsg(null);
                let formattedRunAt = null;
                if (scheduleType === 'datetime') {
                    const match = scheduleDateTime.match(/^(\d{2}):(\d{2}):(\d{4}) (\d{2}):(\d{2}):(\d{2})$/);
                    if (!match) { setAlertMsg({ type: 'error', text: "Invalid format. Use DD:MM:YYYY HH:MM:SS" }); return; }
                    formattedRunAt = `${match[3]}-${match[2]}-${match[1]}T${match[4]}:${match[5]}:${match[6]}`;
                }

                try {
                    const res = await fetch('http://localhost:8000/schedule', {
                        method: 'POST', headers: getAuthHeaders(),
                        body: JSON.stringify({
                            target: target, schedule_type: scheduleType,
                            minutes: scheduleType === 'interval' ? parseInt(scheduleInterval) : null,
                            run_at: formattedRunAt
                        })
                    });
                    if (res.status === 401) return handleLogout();
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail);
                    setAlertMsg({ type: 'success', text: data.message });
                    fetchSchedules(); 
                } catch (err) { setAlertMsg({ type: 'error', text: err.message }); }
            };

            const terminateSchedule = async (jobId) => {
                if(!window.confirm("Terminate this automated task?")) return;
                try {
                    await fetch(`http://localhost:8000/schedules/${jobId}`, { method: 'DELETE', headers: getAuthHeaders() });
                    fetchSchedules();
                    setAlertMsg({ type: 'success', text: "Task terminated successfully." });
                } catch(err) { setAlertMsg({ type: 'error', text: "Failed to terminate task."}); }
            };

            const viewHistoricalScan = async (id) => {
                try {
                    const res = await fetch(`http://localhost:8000/history/${id}`, { headers: getAuthHeaders() });
                    if (res.status === 401) return handleLogout();
                    setResults(await res.json());
                    setActiveTab('new');
                } catch (err) {}
            };

            const clearAllHistory = async () => {
                if (!window.confirm("WARNING: Are you sure you want to clear ALL history?")) return;
                try {
                    await fetch('http://localhost:8000/history', { method: 'DELETE', headers: getAuthHeaders() });
                    fetchHistory();
                } catch(err) {}
            };
            
            const deleteSingleScan = async (id) => {
                if (!window.confirm("Delete this scan?")) return;
                try {
                    await fetch(`http://localhost:8000/history/${id}`, { method: 'DELETE', headers: getAuthHeaders() });
                    fetchHistory();
                } catch(err) {}
            };

            const filteredSearchHistory = useMemo(() => history.filter(h => h.target.toLowerCase().includes(searchQuery.toLowerCase())), [history, searchQuery]);
            const manualHistory = useMemo(() => history.filter(h => h.scan_type !== 'automated'), [history]);
            const automatedHistory = useMemo(() => history.filter(h => h.scan_type === 'automated'), [history]);

            const SidebarIcon = ({ icon, id, title }) => (
                <div onClick={() => setActiveTab(id)} title={title}
                    className={`w-12 h-12 flex items-center justify-center cursor-pointer transition-all rounded-xl ${activeTab === id ? 'glass-btn' : 'text-muted hover:opacity-75'}`}>
                    <i className={`fa-solid ${icon} text-lg`}></i>
                </div>
            );

            const displayAvatar = profileData?.avatar_data || `https://api.dicebear.com/7.x/initials/svg?seed=${username}&backgroundColor=3b82f6`;

            // Wraps the entire app in either .light-mode or .dark-mode to trigger CSS variable swaps
            const themeClass = isLightMode ? "light-mode" : "dark-mode";

            if (!token) {
                return (
                    <div className={`${themeClass} theme-container flex items-center justify-center p-4 relative min-h-screen`}>
                        <div className="max-w-md w-full glass-panel p-8 z-10">
                            <div className="text-center mb-8">
                                <i className="fa-solid fa-shield-halved text-5xl mb-4 block text-main"></i>
                                <h1 className="text-3xl font-extrabold tracking-tight text-main">SentinelX</h1>
                                <p className="text-muted text-sm mt-2 font-medium">Spatial Secure Authentication</p>
                            </div>
                            {authError && <div className="bg-red-500/20 text-red-500 border border-red-500/50 p-3 rounded-xl mb-6 text-sm text-center font-bold shadow-lg">{authError}</div>}
                            <form onSubmit={handleAuth} className="space-y-5">
                                <div>
                                    <label className="block text-[11px] uppercase text-muted mb-1.5 font-bold tracking-wider">Username</label>
                                    <input type="text" value={username} onChange={e => setUsername(e.target.value)} required className="glass-input p-4 font-bold" />
                                </div>
                                {authMode === 'register' && (
                                    <div>
                                        <label className="block text-[11px] uppercase text-muted mb-1.5 font-bold tracking-wider">Email Address</label>
                                        <input type="email" value={email} onChange={e => setEmail(e.target.value)} required className="glass-input p-4 font-bold" />
                                    </div>
                                )}
                                <div>
                                    <label className="block text-[11px] uppercase text-muted mb-1.5 font-bold tracking-wider">Password</label>
                                    <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="glass-input p-4 font-bold" />
                                </div>
                                <button type="submit" className="w-full glass-btn py-4 mt-2 tracking-wide uppercase text-sm">
                                    {authMode === 'login' ? 'Secure Login' : 'Create Account'}
                                </button>
                            </form>
                            <div className="text-center mt-8 text-sm text-muted font-medium">
                                {authMode === 'login' ? "Don't have an account? " : "Already have an account? "}
                                <button onClick={() => {setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(null);}} className="text-main font-bold hover:underline">
                                    {authMode === 'login' ? 'Register' : 'Login'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`${themeClass} theme-container flex h-screen relative`}>
                    
                    {/* Navigation Sidebar */}
                    <div className="w-[90px] h-full flex flex-col justify-between items-center py-6 glass-panel z-10 shrink-0 border-y-0 border-l-0 rounded-none rounded-r-3xl">
                        <div className="flex flex-col items-center space-y-4">
                            <div className="w-14 h-14 glass-btn flex items-center justify-center mb-4">
                                <i className="fa-solid fa-shield-halved text-xl"></i>
                            </div>
                            <SidebarIcon id="new" icon="fa-crosshairs" title="New Scan" />
                            <SidebarIcon id="search" icon="fa-magnifying-glass" title="Search Scans" />
                            <SidebarIcon id="schedule" icon="fa-calendar-plus" title="Schedule Scan" />
                            <SidebarIcon id="automated" icon="fa-robot" title="Automated Results" />
                            <SidebarIcon id="history" icon="fa-clock-rotate-left" title="History" />
                        </div>

                        <div className="flex flex-col items-center space-y-4">
                            {/* THEME TOGGLE BUTTON */}
                            <div onClick={() => setIsLightMode(!isLightMode)} title="Toggle Light/Dark Mode" className="w-12 h-12 flex items-center justify-center rounded-xl cursor-pointer text-muted hover:opacity-80 transition-all">
                                <i className={`fa-solid ${isLightMode ? 'fa-moon' : 'fa-sun'} text-xl`}></i>
                            </div>

                            <div onClick={() => setIsSettingsOpen(true)} title="Settings" className="w-12 h-12 flex items-center justify-center rounded-xl cursor-pointer text-muted hover:opacity-80 transition-all">
                                <i className="fa-solid fa-gear text-xl"></i>
                            </div>
                            <div onClick={() => setActiveTab('profile')} className="w-12 h-12 rounded-full border-2 border-theme cursor-pointer overflow-hidden mt-2 transition-all">
                                <img src={displayAvatar} alt="Profile" className="w-full h-full object-cover" />
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 overflow-y-auto p-6 md:p-10 z-10">
                        <div className="max-w-4xl mx-auto w-full space-y-8">
                            
                            {activeTab !== 'profile' && (
                                <div className="mb-8 pl-4 border-l-4 border-theme">
                                    <h1 className="text-4xl md:text-5xl font-extrabold tracking-tight text-main">Hello, <span className="opacity-80">{username}</span></h1>
                                    <p className="text-muted mt-2 font-medium">Attack Surface Management Platform</p>
                                </div>
                            )}

                            {alertMsg && (
                                <div className={`p-4 rounded-2xl text-sm font-bold shadow-lg flex items-center text-main border backdrop-blur-md ${alertMsg.type === 'success' ? 'bg-green-500/20 border-green-500/50' : 'bg-red-500/20 border-red-500/50'}`}>
                                    <i className={`fa-solid mr-3 ${alertMsg.type === 'success' ? 'fa-check-circle text-green-500' : 'fa-circle-exclamation text-red-500'} text-lg`}></i>
                                    {alertMsg.text}
                                </div>
                            )}

                            {/* --- TAB: PROFILE --- */}
                            {activeTab === 'profile' && (
                                <div className="max-w-2xl mx-auto mt-8">
                                    <div className="glass-panel overflow-hidden">
                                        <div className="h-36 relative" style={{background: 'var(--profile-banner)'}}></div>
                                        <div className="px-8 pb-8 relative">
                                            <div className="absolute -top-16 rounded-full w-32 h-32 border-4 group cursor-pointer overflow-hidden" style={{borderColor: 'var(--panel-bg)', backgroundColor: 'var(--profile-avatar-bg)'}}>
                                                <img src={displayAvatar} alt="Profile" className="w-full h-full object-cover opacity-90" />
                                                <label className="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all cursor-pointer text-white text-3xl">
                                                    <i className="fa-solid fa-camera mb-1"></i>
                                                    <input type="file" accept="image/*" className="hidden" onChange={handleAvatarUpload} />
                                                </label>
                                            </div>
                                            
                                            <div className="pt-20">
                                                <h2 className="text-3xl font-extrabold tracking-tight text-main">{profileData?.username || username}</h2>
                                                <p className="text-muted font-bold mb-6 uppercase text-xs tracking-wider mt-1">Security Analyst</p>
                                                
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                                                    <div className="glass-sub-panel">
                                                        <div className="text-[10px] uppercase font-extrabold text-muted mb-1 tracking-widest">Email Address</div>
                                                        <div className="font-bold text-main">{profileData?.email || 'Loading...'}</div>
                                                    </div>
                                                    <div className="glass-sub-panel">
                                                        <div className="text-[10px] uppercase font-extrabold text-muted mb-1 tracking-widest">Total Scans</div>
                                                        <div className="font-extrabold text-main text-lg">{profileData?.total_scans !== undefined ? profileData.total_scans : '...'} Scans</div>
                                                    </div>
                                                </div>

                                                <div className="border-t border-theme pt-6 flex justify-end">
                                                    <button onClick={handleLogout} className="px-6 py-3 bg-red-500/20 border border-red-500/30 text-red-500 rounded-xl font-bold flex items-center hover:bg-red-500/30 transition-all">
                                                        <i className="fa-solid fa-right-from-bracket mr-3"></i>Sign Out
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --- TAB: NEW SCAN --- */}
                            {activeTab === 'new' && (
                                <>
                                    <div className="glass-panel p-8">
                                        <h3 className="text-xl font-extrabold mb-6 flex items-center text-main"><i className="fa-solid fa-crosshairs mr-3 opacity-80"></i> Target Acquisition</h3>
                                        <form onSubmit={handleScan} className="flex flex-col md:flex-row gap-4">
                                            <input type="text" value={target} onChange={(e) => setTarget(e.target.value)} placeholder="Enter IP or Domain (e.g. scanme.nmap.org)" 
                                                className="flex-grow glass-input p-4 font-bold" />
                                            <button type="submit" disabled={isScanning} className="glass-btn px-8 py-4 whitespace-nowrap uppercase text-sm tracking-wider">
                                                {isScanning ? <><i className="fa-solid fa-spinner fa-spin mr-2"></i>Scanning...</> : "Launch Scan"}
                                            </button>
                                        </form>
                                    </div>

                                    {results && (
                                        <div className="space-y-6">
                                            <div className="flex justify-between items-end pb-2 border-b border-theme">
                                                <h2 className="text-2xl font-extrabold tracking-tight text-main">Results for <span className="opacity-80">{results.target_ip}</span></h2>
                                                <button onClick={() => window.open(`http://localhost:8000/scans/${results.scan_id}/pdf`, '_blank')} className="flex items-center px-5 py-2.5 glass-btn text-sm font-bold">
                                                    <i className="fa-solid fa-file-pdf mr-2 text-red-500"></i><span>Export PDF</span>
                                                </button>
                                            </div>

                                            {/* Risk Metrics */}
                                            {results.risk_metrics && (
                                                <div className="glass-panel p-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                                                    <div>
                                                        <div className="text-[11px] uppercase font-extrabold text-muted mb-2 tracking-widest">Security Rating</div>
                                                        <div className="flex items-center space-x-4">
                                                            <span className="text-5xl font-black font-mono tracking-tighter text-main">{results.risk_metrics.security_score}<span className="text-xl text-muted">/100</span></span>
                                                            <span className={`px-4 py-1.5 rounded-lg text-[11px] font-black uppercase shadow-lg ${results.risk_metrics.risk_level === 'CRITICAL' ? 'bg-red-500' : results.risk_metrics.risk_level === 'HIGH' ? 'bg-yellow-500' : 'bg-green-500'}`}>
                                                                {results.risk_metrics.risk_level} RISK
                                                            </span>
                                                        </div>
                                                    </div>
                                                    <div className="flex space-x-8 glass-sub-panel">
                                                        <div>
                                                            <div className="text-[10px] uppercase text-muted font-extrabold mb-1 tracking-widest">Open Ports</div>
                                                            <div className="font-mono text-2xl font-black text-main">{results.services.filter(s => s.state === 'open').length}</div>
                                                        </div>
                                                        <div className="border-l border-theme pl-8">
                                                            <div className="text-[10px] uppercase text-muted font-extrabold mb-1 tracking-widest">Total CVEs</div>
                                                            <div className="font-mono text-2xl font-black text-red-500">{results.risk_metrics.total_cves}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {/* Remediations */}
                                            {results.risk_metrics?.remediations?.length > 0 && (
                                                <div className="glass-panel p-6 border-l-4 border-yellow-500">
                                                    <h3 className="text-yellow-500 font-extrabold mb-4 flex items-center text-xs tracking-widest uppercase">
                                                        <i className="fa-solid fa-list-check mr-2 text-lg"></i> Actionable Remediation Guidance
                                                    </h3>
                                                    <ul className="space-y-3 text-sm font-medium text-main">
                                                        {results.risk_metrics.remediations.map((rem, i) => (
                                                            <li key={i} className="flex items-start glass-sub-panel py-3 px-4">
                                                                <i className="fa-solid fa-circle-right text-[10px] text-yellow-500 mt-1.5 mr-3 shrink-0"></i>
                                                                <span className="leading-relaxed">{rem}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            )}

                                            {/* Diff Engine (Changes) */}
                                            {results.changes && !results.changes.is_first_scan && (
                                                <div className="space-y-3">
                                                    {results.changes.new_ports.length > 0 && (
                                                        <div className="bg-red-500/20 border border-red-500/30 text-main px-5 py-4 rounded-2xl flex items-center font-bold">
                                                            <i className="fa-solid fa-triangle-exclamation text-xl mr-4 text-red-500"></i>
                                                            <div>SECURITY ALERT: New ports opened: {results.changes.new_ports.join(", ")}</div>
                                                        </div>
                                                    )}
                                                    {results.changes.closed_ports.length > 0 && (
                                                        <div className="bg-green-500/20 border border-green-500/30 text-main px-5 py-4 rounded-2xl flex items-center font-bold">
                                                            <i className="fa-solid fa-shield-check text-xl mr-4 text-green-500"></i>
                                                            <div>STATUS UPDATE: Ports closed: {results.changes.closed_ports.join(", ")}</div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            {/* Service Cards */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                                {results.services.map((svc, index) => (
                                                    <div key={index} className="glass-panel p-6 flex flex-col justify-between">
                                                        <div>
                                                            <div className="flex justify-between items-center mb-4">
                                                                <div className="flex items-center text-main">
                                                                    <span className={`w-3 h-3 rounded-full mr-3 ${svc.state === 'open' ? 'bg-red-500' : 'bg-gray-500'}`}></span>
                                                                    <span className="font-mono text-xl font-black">Port {svc.port}</span>
                                                                </div>
                                                                <div className={`text-[10px] px-3 py-1.5 rounded-lg font-black uppercase border ${svc.state === 'open' ? 'bg-red-500/20 border-red-500/50 text-red-500' : 'bg-gray-500/20 border-gray-500/50 text-gray-500'}`}>{svc.state}</div>
                                                            </div>
                                                            <div className="text-sm font-extrabold uppercase tracking-widest mb-1 text-main">{svc.service}</div>
                                                            <div className="text-sm text-muted font-medium">{svc.version_info || 'Unknown Version'}</div>
                                                        </div>
                                                        
                                                        {/* Web Recon Details */}
                                                        {svc.web_info && (
                                                            <div className="mt-5 pt-4 border-t border-theme">
                                                                <div className="text-[10px] text-main font-black mb-3 flex items-center tracking-widest uppercase opacity-80">
                                                                    <i className="fa-solid fa-globe mr-2 text-sm"></i> Web Analysis
                                                                </div>
                                                                {svc.web_info.tls && (
                                                                    <div className="mb-3 glass-sub-panel">
                                                                        <div className="text-[9px] uppercase font-black text-muted mb-1.5 tracking-wider">TLS / SSL Cert</div>
                                                                        {svc.web_info.tls.error ? (
                                                                            <div className="text-xs text-red-500 font-bold"><i className="fa-solid fa-triangle-exclamation mr-1"></i> {svc.web_info.tls.error}</div>
                                                                        ) : (
                                                                            <div className="text-main">
                                                                                <div className="text-xs font-medium"><span className="font-bold opacity-70">Issuer:</span> {svc.web_info.tls.issuer}</div>
                                                                                <div className="text-xs font-medium mt-1"><span className="font-bold opacity-70">Expires:</span> {svc.web_info.tls.expires}</div>
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                )}
                                                                {svc.web_info.headers && (
                                                                    <div className="glass-sub-panel">
                                                                        <div className="text-[9px] uppercase font-black text-muted mb-2.5 tracking-wider">Security Headers</div>
                                                                        <div className="space-y-2 text-main">
                                                                            {Object.entries(svc.web_info.headers).map(([key, val]) => (
                                                                                <div key={key} className="flex justify-between items-center text-xs">
                                                                                    <span className="font-semibold">{key}</span>
                                                                                    <span className={`font-mono px-2 py-0.5 rounded text-[9px] font-black ${val === 'Missing' ? 'bg-red-500/20 text-red-500 border border-red-500/50' : 'bg-green-500/20 text-green-500 border border-green-500/50'}`}>
                                                                                        {val === 'Missing' ? 'MISSING' : (val.length > 20 ? val.substring(0,20)+'...' : val.toUpperCase())}
                                                                                    </span>
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )}

                                                        {/* CVE Details */}
                                                        {svc.cves && svc.cves.length > 0 && (
                                                            <div className="mt-5 pt-4 border-t border-theme">
                                                                <div className="text-[10px] text-red-500 font-black mb-3 flex items-center tracking-widest uppercase">
                                                                    <i className="fa-solid fa-bug mr-2 text-sm"></i> Known Vulnerabilities
                                                                </div>
                                                                <div className="flex flex-wrap gap-2">
                                                                    {svc.cves.map(cve => (
                                                                        <a href={`https://nvd.nist.gov/vuln/detail/${cve}`} target="_blank" key={cve} className="text-[10px] bg-red-500/10 border border-red-500/30 text-red-500 px-2.5 py-1 rounded-lg font-mono font-bold hover:bg-red-500/20 transition-colors">
                                                                            {cve}
                                                                        </a>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </>
                            )}

                            {/* --- TAB: SCHEDULE --- */}
                            {activeTab === 'schedule' && (
                                <div className="space-y-8">
                                    <div className="glass-panel p-8 max-w-2xl">
                                        <h3 className="text-xl font-extrabold mb-2 flex items-center text-main"><i className="fa-solid fa-calendar-plus mr-3 opacity-80"></i>Automated Scheduler</h3>
                                        <p className="text-muted text-sm font-medium mb-6">Configure continuous background assessments.</p>
                                        
                                        <form onSubmit={handleSchedule} className="space-y-6">
                                            <div>
                                                <label className="block text-[11px] uppercase text-muted mb-2 font-extrabold tracking-widest">Target IP or Domain</label>
                                                <input type="text" value={target} onChange={(e) => setTarget(e.target.value)} required className="w-full glass-input p-4 font-bold" />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] uppercase text-muted mb-2 font-extrabold tracking-widest">Schedule Type</label>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <button type="button" onClick={() => setScheduleType('interval')} className={`py-3.5 px-4 rounded-xl text-sm font-bold flex items-center justify-center transition-all cursor-pointer ${scheduleType === 'interval' ? 'glass-btn border-main' : 'glass-sub-panel text-muted'}`}>
                                                        <i className="fa-solid fa-arrows-rotate mr-2"></i> Recurring
                                                    </button>
                                                    <button type="button" onClick={() => setScheduleType('datetime')} className={`py-3.5 px-4 rounded-xl text-sm font-bold flex items-center justify-center transition-all cursor-pointer ${scheduleType === 'datetime' ? 'glass-btn border-main' : 'glass-sub-panel text-muted'}`}>
                                                        <i className="fa-solid fa-clock mr-2"></i> Specific Date
                                                    </button>
                                                </div>
                                            </div>
                                            {scheduleType === 'interval' ? (
                                                <div>
                                                    <label className="block text-[11px] uppercase text-muted mb-2 font-extrabold tracking-widest">Repeat Interval (Minutes)</label>
                                                    <input type="number" min="1" value={scheduleInterval} onChange={(e) => setScheduleInterval(e.target.value)} required className="w-full glass-input p-4 font-bold" />
                                                </div>
                                            ) : (
                                                <div>
                                                    <label className="block text-[11px] uppercase text-muted mb-2 font-extrabold tracking-widest">Execution Date & Time</label>
                                                    <input type="text" placeholder="DD:MM:YYYY HH:MM:SS" pattern="\d{2}:\d{2}:\d{4} \d{2}:\d{2}:\d{2}" value={scheduleDateTime} onChange={(e) => setScheduleDateTime(e.target.value)} required className="w-full glass-input p-4 font-bold font-mono tracking-wider" />
                                                </div>
                                            )}
                                            <button type="submit" className="w-full glass-btn py-4 text-sm tracking-wide uppercase">START AUTOMATION TASK</button>
                                        </form>
                                    </div>

                                    {/* Active Tasks List */}
                                    <div className="glass-panel p-8 max-w-2xl border-l-4 border-yellow-500">
                                        <h3 className="text-lg font-extrabold mb-4 flex items-center text-main"><i className="fa-solid fa-bolt mr-3 text-yellow-500"></i> Active Running Tasks</h3>
                                        {activeSchedules.length === 0 ? (
                                            <p className="text-muted font-medium text-sm text-center py-4">No tasks are currently running in the background.</p>
                                        ) : (
                                            <div className="space-y-3">
                                                {activeSchedules.map(job => (
                                                    <div key={job.id} className="flex justify-between items-center glass-sub-panel">
                                                        <div className="text-main">
                                                            <div className="font-bold flex items-center"><span className="w-2 h-2 rounded-full bg-green-500 animate-pulse mr-2 shadow-[0_0_8px_#22c55e]"></span>{job.target}</div>
                                                            <div className="text-xs text-muted font-medium mt-1">Next Run: {new Date(job.next_run).toLocaleString('en-IN')}</div>
                                                        </div>
                                                        <button onClick={() => terminateSchedule(job.id)} className="bg-red-500/10 border border-red-500/30 text-red-500 px-4 py-2 rounded-xl text-xs font-bold flex items-center cursor-pointer hover:bg-red-500/20 transition-all"><i className="fa-solid fa-stop mr-2"></i> Terminate</button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* --- TAB: HISTORY & AUTOMATED --- */}
                            {(activeTab === 'history' || activeTab === 'automated') && (() => {
                                const activeData = activeTab === 'history' ? manualHistory : automatedHistory;
                                const title = activeTab === 'history' ? 'Manual Scan History' : 'Automated Scan Results';
                                const icon = activeTab === 'history' ? 'fa-clock-rotate-left' : 'fa-robot';
                                
                                return (
                                    <div className="space-y-6">
                                        <div className="flex justify-between items-center pb-2 border-b border-theme">
                                            <h2 className="text-2xl font-extrabold tracking-tight flex items-center text-main"><i className={`fa-solid ${icon} mr-3 opacity-80`}></i> {title}</h2>
                                            {activeData.length > 0 && (
                                                <button onClick={clearAllHistory} className="text-sm font-bold bg-red-500/10 border border-red-500/30 text-red-500 px-5 py-2.5 rounded-xl cursor-pointer hover:bg-red-500/20 transition-all"><i className="fa-solid fa-trash-can mr-2"></i>Clear History</button>
                                            )}
                                        </div>
                                        <div className="glass-panel overflow-hidden">
                                            <table className="w-full text-left">
                                                <thead>
                                                    <tr className="border-b border-theme text-muted text-[11px] font-extrabold uppercase tracking-widest">
                                                        <th className="p-5 hidden sm:table-cell">ID</th>
                                                        <th className="p-5">Target</th>
                                                        <th className="p-5 hidden md:table-cell">Date & Time</th>
                                                        <th className="p-5 text-right">Actions</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {activeData.length === 0 ? (
                                                        <tr><td colSpan="4" className="p-10 text-center text-muted font-bold">No scan records available.</td></tr>
                                                    ) : (
                                                        activeData.map(r => (
                                                            <tr key={r.id} className="border-b border-theme">
                                                                <td className="p-5 text-muted text-sm hidden sm:table-cell font-mono">#{r.id}</td>
                                                                <td className="p-5 font-mono font-extrabold text-main text-base">{r.target}</td>
                                                                <td className="p-5 text-muted text-sm hidden md:table-cell font-medium">{new Date(r.time).toLocaleString('en-IN')}</td>
                                                                <td className="p-5 text-right space-x-3">
                                                                    <button onClick={() => viewHistoricalScan(r.id)} className="glass-btn px-4 py-2 rounded-xl text-xs font-bold cursor-pointer">View</button>
                                                                    <button onClick={() => deleteSingleScan(r.id)} className="bg-red-500/10 border border-red-500/30 text-red-500 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer hover:bg-red-500/20"><i className="fa-solid fa-trash"></i></button>
                                                                </td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )
                            })()}

                            {/* --- TAB: SEARCH SCAN --- */}
                            {activeTab === 'search' && (
                                <div className="space-y-8">
                                    <div className="glass-panel p-8">
                                        <h3 className="text-xl font-extrabold mb-6 flex items-center text-main"><i className="fa-solid fa-magnifying-glass mr-3 opacity-80"></i>Search Database</h3>
                                        <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Type target IP or domain to filter..." 
                                            className="w-full glass-input p-4 font-bold text-lg" />
                                    </div>
                                    <div className="glass-panel overflow-hidden">
                                        {filteredSearchHistory.length > 0 ? (
                                            <table className="w-full text-left">
                                                <tbody>
                                                    {filteredSearchHistory.map(r => (
                                                        <tr key={r.id} className="border-b border-theme">
                                                            <td className="p-5 font-mono font-extrabold text-main text-base">{r.target}</td>
                                                            <td className="p-5 text-muted text-sm hidden md:table-cell font-medium">
                                                                {new Date(r.time).toLocaleString('en-IN')} 
                                                                <span className="ml-3 text-[10px] uppercase glass-sub-panel px-2.5 py-1 rounded-md font-bold tracking-widest text-muted">{r.scan_type}</span>
                                                            </td>
                                                            <td className="p-5 text-right">
                                                                <button onClick={() => viewHistoricalScan(r.id)} className="glass-btn px-5 py-2.5 rounded-xl text-xs font-bold cursor-pointer">Open Scan</button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        ) : (
                                            <div className="p-12 text-center text-muted font-bold">No results found for "{searchQuery}"</div>
                                        )}
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>

                    {/* --- SETTINGS MODAL (Gear) --- */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="glass-panel w-full max-w-md p-0 overflow-hidden flex flex-col border border-theme">
                                <div className="flex justify-between items-center p-6 border-b border-theme glass-sub-panel rounded-none">
                                    <h2 className="text-xl font-extrabold tracking-tight text-main"><i className="fa-solid fa-sliders mr-3 opacity-80"></i>Preferences</h2>
                                    <button onClick={() => setIsSettingsOpen(false)} className="w-8 h-8 flex items-center justify-center rounded-full text-muted hover:text-main hover:bg-black/10 transition cursor-pointer">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <div className="p-6 space-y-6">
                                    <div className="glass-sub-panel">
                                        <label className="font-bold block mb-2 text-sm text-main">Display Language</label>
                                        <select value={language} onChange={(e) => setLanguage(e.target.value)} className="w-full glass-input p-3.5 focus:outline-none font-bold" style={{backgroundColor: 'var(--bg-color)'}}>
                                            <option value="en">English (US)</option>
                                            <option value="hi">Hinglish</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
