<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelX | Advanced Threat Surface</title>
    
    <!-- Modern Web App Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { geminiDark: '#131314', geminiSidebar: '#1e1f20' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.4); border: 1px solid #334155; }
        .light .glass-panel { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #374151; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            // --- Global State ---
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [language, setLanguage] = useState('en');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            
            // --- Auth State ---
            const [token, setToken] = useState(localStorage.getItem('token'));
            const [authMode, setAuthMode] = useState('login');
            const [username, setUsername] = useState(localStorage.getItem('username') || '');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState(null);

            // --- App State ---
            const [activeTab, setActiveTab] = useState('new');
            const [target, setTarget] = useState('scanme.nmap.org');
            const [scheduleType, setScheduleType] = useState('interval'); // 'interval' or 'datetime'
            const [scheduleInterval, setScheduleInterval] = useState(60);
            const [scheduleDateTime, setScheduleDateTime] = useState('');
            const [isScanning, setIsScanning] = useState(false);
            const [results, setResults] = useState(null);
            const [alertMsg, setAlertMsg] = useState(null);
            const [history, setHistory] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light');
                } else {
                    document.documentElement.classList.add('light');
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            const getAuthHeaders = () => ({
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            });

            // --- Authentication ---
            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError(null);
                try {
                    if (authMode === 'register') {
                        const res = await fetch('http://localhost:8000/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, password })
                        });
                        if (!res.ok) throw new Error("Registration failed. Username might exist.");
                        setAuthMode('login');
                        setAuthError("Registration successful! Please log in.");
                    } else {
                        const formData = new URLSearchParams();
                        formData.append('username', username);
                        formData.append('password', password);
                        
                        const res = await fetch('http://localhost:8000/token', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: formData
                        });
                        if (!res.ok) throw new Error("Invalid credentials");
                        const data = await res.json();
                        setToken(data.access_token);
                        localStorage.setItem('token', data.access_token);
                        localStorage.setItem('username', username);
                    }
                } catch (err) {
                    setAuthError(err.message);
                }
            };

            const handleLogout = () => {
                setToken(null);
                localStorage.removeItem('token');
                localStorage.removeItem('username');
                setResults(null);
            };

            // --- Core Functions ---
            const fetchHistory = async () => {
                const res = await fetch('http://localhost:8000/history', { headers: getAuthHeaders() });
                if (res.status === 401) return handleLogout();
                setHistory(await res.json());
            };

            useEffect(() => { 
                if (token && (activeTab === 'history' || activeTab === 'automated' || activeTab === 'search')) {
                    fetchHistory(); 
                }
            }, [activeTab, token]);

            const handleScan = async (e) => {
                e.preventDefault();
                setIsScanning(true);
                setResults(null);
                setAlertMsg(null);
                try {
                    const res = await fetch(`http://localhost:8000/scan/${target}`, { headers: getAuthHeaders() });
                    if (res.status === 401) return handleLogout();
                    setResults(await res.json());
                } catch (err) {
                    setAlertMsg({ type: 'error', text: "Scan failed to execute." });
                } finally {
                    setIsScanning(false);
                }
            };

            const handleSchedule = async (e) => {
                e.preventDefault();
                setAlertMsg(null);
                
                const payload = {
                    target: target,
                    schedule_type: scheduleType,
                    minutes: scheduleType === 'interval' ? parseInt(scheduleInterval) : null,
                    run_at: scheduleType === 'datetime' ? scheduleDateTime : null
                };

                try {
                    const res = await fetch('http://localhost:8000/schedule', {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify(payload)
                    });
                    if (res.status === 401) return handleLogout();
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || "Failed to schedule");
                    setAlertMsg({ type: 'success', text: data.message });
                } catch (err) {
                    setAlertMsg({ type: 'error', text: err.message || "Failed to schedule task." });
                }
            };

            const viewHistoricalScan = async (id) => {
                try {
                    const res = await fetch(`http://localhost:8000/history/${id}`, { headers: getAuthHeaders() });
                    if (res.status === 401) return handleLogout();
                    setResults(await res.json());
                    setActiveTab('new');
                } catch (err) {
                    alert("Failed to fetch historical scan.");
                }
            };

            const deleteSingleScan = async (id) => {
                if (!window.confirm("Are you sure you want to delete this scan?")) return;
                try {
                    await fetch(`http://localhost:8000/history/${id}`, { method: 'DELETE', headers: getAuthHeaders() });
                    fetchHistory();
                } catch(err) { alert("Failed to delete scan"); }
            };

            const clearAllHistory = async () => {
                if (!window.confirm("WARNING: Are you sure you want to clear ALL history? This action cannot be undone.")) return;
                try {
                    await fetch('http://localhost:8000/history', { method: 'DELETE', headers: getAuthHeaders() });
                    fetchHistory();
                } catch(err) { alert("Failed to clear history"); }
            };

            const filteredSearchHistory = useMemo(() => history.filter(h => h.target.toLowerCase().includes(searchQuery.toLowerCase())), [history, searchQuery]);
            const manualHistory = useMemo(() => history.filter(h => h.scan_type !== 'automated'), [history]);
            const automatedHistory = useMemo(() => history.filter(h => h.scan_type === 'automated'), [history]);

            const SidebarIcon = ({ icon, id, title }) => (
                <div 
                    onClick={() => setActiveTab(id)}
                    title={title}
                    className={`w-10 h-10 flex items-center justify-center rounded-full cursor-pointer transition-all duration-200 
                        ${activeTab === id 
                            ? 'bg-blue-600/20 text-blue-500 dark:bg-blue-500/20 dark:text-blue-400 font-bold' 
                            : 'text-gray-500 hover:bg-gray-200 dark:text-gray-400 dark:hover:bg-gray-800'}`}
                >
                    <i className={`fa-solid ${icon} text-lg`}></i>
                </div>
            );

            if (!token) {
                return (
                    <div className="min-h-screen bg-gray-50 dark:bg-geminiDark flex items-center justify-center p-4">
                        <div className="max-w-md w-full glass-panel p-8 rounded-2xl">
                            <div className="text-center mb-8">
                                <i className="fa-solid fa-shield-halved text-5xl text-blue-500 mb-4"></i>
                                <h1 className="text-2xl font-bold dark:text-white text-gray-900 tracking-tight">SentinelX Identity</h1>
                                <p className="dark:text-gray-400 text-gray-500 text-sm mt-2">Sign in to access the platform</p>
                            </div>
                            {authError && <div className="bg-red-500/10 border border-red-500/50 text-red-500 p-3 rounded-lg mb-4 text-sm text-center">{authError}</div>}
                            <form onSubmit={handleAuth} className="space-y-5">
                                <div>
                                    <label className="block text-xs uppercase dark:text-gray-400 text-gray-500 mb-1 font-semibold tracking-wider">Username</label>
                                    <input type="text" value={username} onChange={e => setUsername(e.target.value)} required 
                                        className="w-full dark:bg-[#131314] bg-white border dark:border-gray-700 border-gray-300 rounded-lg p-3 dark:text-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                </div>
                                <div>
                                    <label className="block text-xs uppercase dark:text-gray-400 text-gray-500 mb-1 font-semibold tracking-wider">Password</label>
                                    <input type="password" value={password} onChange={e => setPassword(e.target.value)} required 
                                        className="w-full dark:bg-[#131314] bg-white border dark:border-gray-700 border-gray-300 rounded-lg p-3 dark:text-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                </div>
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-lg font-bold transition shadow-lg shadow-blue-500/30">
                                    {authMode === 'login' ? 'Secure Login' : 'Create Account'}
                                </button>
                            </form>
                            <div className="text-center mt-6 text-sm dark:text-gray-400 text-gray-600">
                                {authMode === 'login' ? "Don't have an account? " : "Already have an account? "}
                                <button onClick={() => {setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(null);}} className="text-blue-500 hover:underline font-semibold">
                                    {authMode === 'login' ? 'Register' : 'Login'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen bg-white dark:bg-geminiDark text-gray-900 dark:text-gray-100 transition-colors duration-300">
                    
                    {/* Left Sidebar */}
                    <div className="w-[72px] h-full flex flex-col justify-between items-center py-6 bg-gray-50 dark:bg-geminiSidebar border-r border-gray-200 dark:border-gray-800 z-10 shrink-0">
                        <div className="flex flex-col items-center space-y-6">
                            <div className="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center text-white mb-4 shadow-lg shadow-blue-500/20">
                                <i className="fa-solid fa-shield-halved text-xl"></i>
                            </div>
                            <SidebarIcon id="new" icon="fa-plus" title="New Scan" />
                            <SidebarIcon id="search" icon="fa-magnifying-glass" title="Search Scans" />
                            <SidebarIcon id="schedule" icon="fa-calendar-plus" title="Schedule Scan" />
                            <SidebarIcon id="automated" icon="fa-robot" title="Automated Results" />
                            <SidebarIcon id="history" icon="fa-clock-rotate-left" title="Manual History" />
                        </div>

                        <div className="flex flex-col items-center space-y-6">
                            <div onClick={() => setIsSettingsOpen(true)} title="Settings" className="w-10 h-10 flex items-center justify-center rounded-full cursor-pointer text-gray-500 hover:bg-gray-200 dark:text-gray-400 dark:hover:bg-gray-800 transition-all">
                                <i className="fa-solid fa-gear text-lg"></i>
                            </div>
                            <div title="Logout" onClick={handleLogout} className="cursor-pointer">
                                <img src={`https://api.dicebear.com/7.x/initials/svg?seed=${username}&backgroundColor=3b82f6`} alt="Profile" className="w-9 h-9 rounded-full ring-2 ring-transparent hover:ring-blue-500 transition-all shadow-md" />
                            </div>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 overflow-y-auto p-6 md:p-10">
                        <div className="max-w-4xl mx-auto w-full">
                            
                            <div className="mb-10 animate-fade-in-up">
                                <h1 className="text-3xl md:text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-indigo-500 mb-2 tracking-tight">
                                    Hello, {username}
                                </h1>
                                <p className="text-gray-500 dark:text-gray-400 text-sm font-medium">
                                    {language === 'hi' ? 'Aaj aapka system kaisa chal raha hai?' : 'How can I help you secure your network today?'}
                                </p>
                            </div>

                            {alertMsg && (
                                <div className={`p-4 mb-6 rounded-xl border text-sm font-medium ${alertMsg.type === 'success' ? 'bg-green-50 dark:bg-green-500/10 text-green-700 dark:text-green-400 border-green-200 dark:border-green-500/30' : 'bg-red-50 dark:bg-red-500/10 text-red-700 dark:text-red-400 border-red-200 dark:border-red-500/30'}`}>
                                    {alertMsg.text}
                                </div>
                            )}

                            {/* TAB: NEW SCAN */}
                            {activeTab === 'new' && (
                                <div className="space-y-8">
                                    <div className="glass-panel p-6 md:p-8 rounded-2xl shadow-sm">
                                        <h3 className="text-xl font-bold mb-6 flex items-center tracking-tight"><i className="fa-solid fa-crosshairs mr-3 text-blue-500"></i>Target Acquisition</h3>
                                        <form onSubmit={handleScan} className="flex flex-col md:flex-row gap-4">
                                            <input type="text" value={target} onChange={(e) => setTarget(e.target.value)} placeholder="Enter IP or Domain (e.g. scanme.nmap.org)" 
                                                className="flex-grow bg-gray-50 dark:bg-[#131314] border border-gray-300 dark:border-gray-700 rounded-xl p-4 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium" />
                                            <button type="submit" disabled={isScanning} className="bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-xl font-bold transition-all shadow-lg shadow-blue-500/30 whitespace-nowrap">
                                                {isScanning ? <><i className="fa-solid fa-spinner fa-spin mr-2"></i>Scanning...</> : "Launch Scan"}
                                            </button>
                                        </form>
                                    </div>

                                    {results && (
                                        <div className="animate-fade-in-up">
                                            <div className="flex justify-between items-end mb-6 pb-4 border-b border-gray-200 dark:border-gray-800">
                                                <h2 className="text-2xl font-bold tracking-tight">Results for <span className="text-blue-500">{results.target_ip}</span></h2>
                                                <button onClick={() => window.open(`http://localhost:8000/scans/${results.scan_id}/pdf`, '_blank')} className="flex items-center px-4 py-2 bg-gray-100 dark:bg-geminiSidebar hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg text-sm font-semibold transition-colors border border-gray-200 dark:border-gray-700">
                                                    <i className="fa-solid fa-file-pdf mr-2 text-red-500"></i>Export PDF
                                                </button>
                                            </div>

                                            {results.changes && !results.changes.is_first_scan && (
                                                <div className="mb-8 space-y-3">
                                                    {results.changes.new_ports.length > 0 && (
                                                        <div className="bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/30 text-red-700 dark:text-red-400 px-5 py-4 rounded-xl flex items-center">
                                                            <i className="fa-solid fa-triangle-exclamation text-xl mr-4"></i>
                                                            <div><span className="font-bold">SECURITY ALERT:</span> New ports opened: {results.changes.new_ports.join(", ")}</div>
                                                        </div>
                                                    )}
                                                    {results.changes.closed_ports.length > 0 && (
                                                        <div className="bg-green-50 dark:bg-green-500/10 border border-green-200 dark:border-green-500/30 text-green-700 dark:text-green-400 px-5 py-4 rounded-xl flex items-center">
                                                            <i className="fa-solid fa-shield-check text-xl mr-4"></i>
                                                            <div><span className="font-bold">STATUS UPDATE:</span> Ports closed: {results.changes.closed_ports.join(", ")}</div>
                                                        </div>
                                                    )}
                                                    {results.changes.new_ports.length === 0 && results.changes.closed_ports.length === 0 && (
                                                        <div className="bg-blue-50 dark:bg-blue-500/10 border border-blue-200 dark:border-blue-500/30 text-blue-700 dark:text-blue-400 px-5 py-4 rounded-xl flex items-center">
                                                            <i className="fa-solid fa-check text-xl mr-4"></i>
                                                            <div><span className="font-bold">NO CHANGES:</span> Attack surface remains identical to the previous scan.</div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {results.services.map((svc, index) => {
                                                    const isOpen = svc.state === 'open';
                                                    return (
                                                        <div key={index} className="glass-panel p-5 rounded-xl flex flex-col justify-between group hover:border-blue-500/50 transition-colors">
                                                            <div>
                                                                <div className="flex justify-between items-center mb-3">
                                                                    <div className="flex items-center">
                                                                        <span className={`w-2.5 h-2.5 rounded-full mr-3 ${isOpen ? 'bg-red-500' : 'bg-gray-500'}`}></span>
                                                                        <span className="font-mono text-xl font-bold">Port {svc.port}</span>
                                                                    </div>
                                                                    <div className={`text-xs px-2.5 py-1 rounded-md font-extrabold uppercase ${isOpen ? 'bg-red-100 text-red-600 dark:bg-red-500/20 dark:text-red-400' : 'bg-gray-200 text-gray-600 dark:bg-gray-800 dark:text-gray-400'}`}>{svc.state}</div>
                                                                </div>
                                                                <div className="text-sm font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wider mb-1">{svc.service}</div>
                                                                <div className="text-sm text-gray-500">{svc.version_info || 'Unknown Version'}</div>
                                                            </div>
                                                            {svc.cves && svc.cves.length > 0 && (
                                                                <div className="mt-5 pt-4 border-t border-gray-200 dark:border-gray-800">
                                                                    <div className="text-xs text-red-600 dark:text-red-400 font-bold mb-2 flex items-center">
                                                                        <i className="fa-solid fa-bug mr-2"></i> KNOWN VULNERABILITIES
                                                                    </div>
                                                                    <div className="flex flex-wrap gap-2">
                                                                        {svc.cves.map(cve => (
                                                                            <a href={`https://nvd.nist.gov/vuln/detail/${cve}`} target="_blank" key={cve} className="text-xs bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-300 px-2 py-1 rounded-md border border-red-200 dark:border-red-800/50 font-mono">
                                                                                {cve}
                                                                            </a>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* TAB: SCHEDULE SCAN */}
                            {activeTab === 'schedule' && (
                                <div className="glass-panel p-6 md:p-8 rounded-2xl shadow-sm max-w-2xl">
                                    <h3 className="text-xl font-bold mb-2 flex items-center tracking-tight"><i className="fa-solid fa-calendar-plus mr-3 text-purple-500"></i>Automated Task Scheduler</h3>
                                    <p className="text-gray-500 dark:text-gray-400 text-sm mb-6">Configure continuous or one-time background security assessments.</p>
                                    
                                    <form onSubmit={handleSchedule} className="space-y-6">
                                        <div>
                                            <label className="block text-xs uppercase text-gray-500 dark:text-gray-400 mb-2 font-bold tracking-wider">Target IP or Domain</label>
                                            <input type="text" value={target} onChange={(e) => setTarget(e.target.value)} required className="w-full bg-gray-50 dark:bg-[#131314] border border-gray-300 dark:border-gray-700 rounded-xl p-4 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-500 font-medium" />
                                        </div>

                                        {/* Schedule Type Selector */}
                                        <div>
                                            <label className="block text-xs uppercase text-gray-500 dark:text-gray-400 mb-2 font-bold tracking-wider">Schedule Type</label>
                                            <div className="grid grid-cols-2 gap-3">
                                                <button type="button" onClick={() => setScheduleType('interval')} 
                                                    className={`py-3 px-4 rounded-xl border text-sm font-bold flex items-center justify-center transition-all ${scheduleType === 'interval' ? 'bg-purple-600 text-white border-purple-600 shadow-md shadow-purple-500/20' : 'bg-gray-50 dark:bg-[#131314] border-gray-300 dark:border-gray-700 text-gray-600 dark:text-gray-400'}`}>
                                                    <i className="fa-solid fa-arrows-rotate mr-2"></i> Recurring Interval
                                                </button>
                                                <button type="button" onClick={() => setScheduleType('datetime')} 
                                                    className={`py-3 px-4 rounded-xl border text-sm font-bold flex items-center justify-center transition-all ${scheduleType === 'datetime' ? 'bg-purple-600 text-white border-purple-600 shadow-md shadow-purple-500/20' : 'bg-gray-50 dark:bg-[#131314] border-gray-300 dark:border-gray-700 text-gray-600 dark:text-gray-400'}`}>
                                                    <i className="fa-solid fa-clock mr-2"></i> Specific Date & Time
                                                </button>
                                            </div>
                                        </div>

                                        {/* Dynamic Fields based on scheduleType */}
                                        {scheduleType === 'interval' ? (
                                            <div>
                                                <label className="block text-xs uppercase text-gray-500 dark:text-gray-400 mb-2 font-bold tracking-wider">Repeat Interval (Minutes)</label>
                                                <input type="number" min="1" value={scheduleInterval} onChange={(e) => setScheduleInterval(e.target.value)} required className="w-full bg-gray-50 dark:bg-[#131314] border border-gray-300 dark:border-gray-700 rounded-xl p-4 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-500 font-medium" />
                                            </div>
                                        ) : (
                                            <div>
                                                <label className="block text-xs uppercase text-gray-500 dark:text-gray-400 mb-2 font-bold tracking-wider">Select Execution Date & Time</label>
                                                <input type="datetime-local" value={scheduleDateTime} onChange={(e) => setScheduleDateTime(e.target.value)} required className="w-full bg-gray-50 dark:bg-[#131314] border border-gray-300 dark:border-gray-700 rounded-xl p-4 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-500 font-medium" />
                                            </div>
                                        )}

                                        <button type="submit" className="w-full py-4 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-bold transition shadow-lg shadow-purple-500/30">
                                            Confirm Automated Task
                                        </button>
                                    </form>
                                </div>
                            )}

                            {/* TAB: HISTORY & AUTOMATED */}
                            {(activeTab === 'history' || activeTab === 'automated') && (() => {
                                const activeData = activeTab === 'history' ? manualHistory : automatedHistory;
                                const title = activeTab === 'history' ? 'Manual Scan History' : 'Automated Scan Results';
                                const icon = activeTab === 'history' ? 'fa-clock-rotate-left' : 'fa-robot';
                                
                                return (
                                    <div className="space-y-4">
                                        <div className="flex justify-between items-center mb-4">
                                            <h2 className="text-xl font-bold flex items-center tracking-tight"><i className={`fa-solid ${icon} mr-3 text-blue-500`}></i>{title}</h2>
                                            {history.length > 0 && (
                                                <button onClick={clearAllHistory} className="text-sm font-semibold bg-red-50 hover:bg-red-100 text-red-600 dark:bg-red-900/20 dark:hover:bg-red-900/40 dark:text-red-400 px-4 py-2 rounded-lg transition-colors border border-red-200 dark:border-red-800/50">
                                                    <i className="fa-solid fa-trash-can mr-2"></i>Clear All History
                                                </button>
                                            )}
                                        </div>
                                        <div className="glass-panel rounded-2xl shadow-sm overflow-hidden">
                                            <table className="w-full text-left border-collapse">
                                                <thead className="bg-gray-100 dark:bg-geminiSidebar border-b border-gray-200 dark:border-gray-800 text-gray-500 dark:text-gray-400 text-xs font-bold uppercase tracking-wider">
                                                    <tr>
                                                        <th className="p-4 hidden sm:table-cell">ID</th>
                                                        <th className="p-4">Target</th>
                                                        <th className="p-4 hidden md:table-cell">Date & Time (IST)</th>
                                                        <th className="p-4 text-right">Actions</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {activeData.length === 0 ? (
                                                        <tr><td colSpan="4" className="p-8 text-center text-gray-500 font-medium">No scan records available.</td></tr>
                                                    ) : (
                                                        activeData.map(r => (
                                                            <tr key={r.id} className="border-b border-gray-200 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-[#1e1f20]/50 transition-colors">
                                                                <td className="p-4 text-gray-400 text-sm hidden sm:table-cell font-mono">#{r.id}</td>
                                                                <td className="p-4 font-mono font-bold text-gray-900 dark:text-gray-200">{r.target}</td>
                                                                <td className="p-4 text-gray-500 dark:text-gray-400 text-sm hidden md:table-cell font-medium">{new Date(r.time).toLocaleString('en-IN')}</td>
                                                                <td className="p-4 text-right space-x-2">
                                                                    <button onClick={() => viewHistoricalScan(r.id)} className="bg-white border border-gray-300 hover:bg-gray-50 dark:bg-transparent dark:border-gray-600 dark:hover:bg-gray-800 text-gray-700 dark:text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition-all">
                                                                        View
                                                                    </button>
                                                                    <button onClick={() => deleteSingleScan(r.id)} className="border border-red-200 bg-red-50 text-red-600 hover:bg-red-100 dark:border-red-800/50 dark:bg-red-900/20 dark:text-red-400 dark:hover:bg-red-900/40 px-3 py-1.5 rounded-lg text-sm font-semibold transition-all" title="Delete Scan">
                                                                        <i className="fa-solid fa-trash"></i>
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )
                            })()}

                            {/* TAB: SEARCH SCAN */}
                            {activeTab === 'search' && (
                                <div className="space-y-6">
                                    <div className="glass-panel p-6 rounded-2xl shadow-sm">
                                        <h3 className="text-xl font-bold mb-4 flex items-center tracking-tight"><i className="fa-solid fa-magnifying-glass mr-3 text-blue-500"></i>Search Database</h3>
                                        <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Type target IP or domain to filter..." 
                                            className="w-full bg-gray-50 dark:bg-[#131314] border border-gray-300 dark:border-gray-700 rounded-xl p-4 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium" />
                                    </div>
                                    <div className="glass-panel rounded-2xl overflow-hidden shadow-sm">
                                        {filteredSearchHistory.length > 0 ? (
                                            <table className="w-full text-left border-collapse">
                                                <tbody>
                                                    {filteredSearchHistory.map(r => (
                                                        <tr key={r.id} className="border-b border-gray-200 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-geminiSidebar transition-colors">
                                                            <td className="p-4 font-mono font-bold text-blue-600 dark:text-blue-400">{r.target}</td>
                                                            <td className="p-4 text-gray-500 dark:text-gray-400 text-sm hidden md:table-cell font-medium">
                                                                {new Date(r.time).toLocaleString('en-IN')} <span className="ml-2 text-xs uppercase bg-gray-200 dark:bg-gray-800 px-2 py-1 rounded font-bold">{r.scan_type}</span>
                                                            </td>
                                                            <td className="p-4 text-right">
                                                                <button onClick={() => viewHistoricalScan(r.id)} className="bg-gray-200 hover:bg-gray-300 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-800 dark:text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors">Open Scan</button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        ) : (
                                            <div className="p-8 text-center text-gray-500 font-medium">No results found for "{searchQuery}"</div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* SETTINGS MODAL */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white dark:bg-geminiSidebar w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-fade-in-up">
                                <div className="flex justify-between items-center p-6 border-b border-gray-200 dark:border-gray-800">
                                    <h2 className="text-xl font-bold tracking-tight"><i className="fa-solid fa-sliders mr-2"></i>Settings</h2>
                                    <button onClick={() => setIsSettingsOpen(false)} className="text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white transition">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                <div className="p-6 space-y-6">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <div className="font-bold text-gray-900 dark:text-white">Theme</div>
                                            <div className="text-xs text-gray-500 dark:text-gray-400">Toggle dark or light interface</div>
                                        </div>
                                        <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-14 h-8 bg-gray-200 dark:bg-blue-600 rounded-full p-1 transition-colors duration-300 relative flex items-center">
                                            <div className={`w-6 h-6 bg-white rounded-full shadow-md transform transition-transform duration-300 flex justify-center items-center ${isDarkMode ? 'translate-x-6' : 'translate-x-0'}`}>
                                                <i className={`fa-solid text-xs ${isDarkMode ? 'fa-moon text-blue-600' : 'fa-sun text-yellow-500'}`}></i>
                                            </div>
                                        </button>
                                    </div>
                                    <div>
                                        <label className="font-bold text-gray-900 dark:text-white block mb-2 text-sm">Display Language</label>
                                        <select value={language} onChange={(e) => setLanguage(e.target.value)} className="w-full bg-gray-50 dark:bg-[#131314] border border-gray-300 dark:border-gray-700 rounded-xl p-3 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                                            <option value="en">English (US)</option>
                                            <option value="hi">Hinglish</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="p-4 bg-gray-50 dark:bg-[#131314] text-right rounded-b-2xl">
                                    <button onClick={() => setIsSettingsOpen(false)} className="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition-colors">Done</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
