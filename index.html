<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelX | Attack Surface Platform</title>
    
    <!-- 1. Load React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 2. Load Tailwind CSS and Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid #334155; }
    </style>
</head>
<body class="min-h-screen p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // Tab Navigation State
            const [activeTab, setActiveTab] = useState('scan'); // 'scan' or 'history'

            // Scan State
            const [target, setTarget] = useState('scanme.nmap.org');
            const [isScanning, setIsScanning] = useState(false);
            const [results, setResults] = useState(null);
            const [error, setError] = useState(null);

            // History State
            const [history, setHistory] = useState([]);
            const [isLoadingHistory, setIsLoadingHistory] = useState(false);
            const [historyResults, setHistoryResults] = useState(null);

            // --- SCANNING LOGIC ---
            const handleScan = async (e) => {
                e.preventDefault();
                setIsScanning(true);
                setError(null);
                setResults(null);

                try {
                    const response = await fetch(`http://localhost:8000/scan/${target}`);
                    if (!response.ok) throw new Error(`API returned status: ${response.status}`);
                    const data = await response.json();
                    setResults(data);
                } catch (err) {
                    setError("Failed to connect to the SentinelX engine. Is your Python API running?");
                    console.error(err);
                } finally {
                    setIsScanning(false);
                }
            };

            // --- HISTORY LOGIC ---
            const fetchHistory = async () => {
                setIsLoadingHistory(true);
                setHistoryResults(null); // Clear previous open history result
                try {
                    const response = await fetch(`http://localhost:8000/scans`);
                    if (!response.ok) throw new Error("Failed to fetch history");
                    const data = await response.json();
                    setHistory(data);
                } catch (err) {
                    console.error(err);
                } finally {
                    setIsLoadingHistory(false);
                }
            };

            const fetchHistoryDetails = async (scanId) => {
                try {
                    const response = await fetch(`http://localhost:8000/scans/${scanId}`);
                    if (!response.ok) throw new Error("Failed to fetch scan details");
                    const data = await response.json();
                    // Keep the original scanId in the results object so we can use it for the PDF link
                    setHistoryResults({ ...data, id: scanId }); 
                } catch (err) {
                    console.error(err);
                }
            };

            // Switch to history tab and load data automatically
            const openHistoryTab = () => {
                setActiveTab('history');
                fetchHistory();
            };

            // --- REUSABLE UI COMPONENT FOR RESULTS ---
            const renderResults = (data) => {
                if (!data) return null;
                return (
                    <div className="animate-fade-in-up mt-8">
                        <div className="flex justify-between items-end mb-4 border-b border-slate-700 pb-2">
                            <h2 className="text-xl font-semibold">
                                Scan Results for <span className="text-blue-400">{data.target_ip}</span> ({data.hostname})
                            </h2>
                            
                            {/* NEW: Download PDF Button (Only shows if we are looking at a history item with an ID) */}
                            {data.id && (
                                <a 
                                    href={`http://localhost:8000/scans/${data.id}/pdf`}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-semibold transition-colors flex items-center shadow-lg"
                                >
                                    <i className="fa-solid fa-file-pdf mr-2"></i>
                                    Download PDF
                                </a>
                            )}
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {data.services.map((svc, index) => {
                                const isOpen = svc.state === 'open';
                                const borderClass = isOpen ? 'border-l-4 border-l-red-500' : 'border-l-4 border-l-slate-600';
                                
                                return (
                                    <div key={index} className={`glass-panel p-5 rounded-lg ${borderClass} flex flex-col justify-between`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <div className="font-mono text-lg font-bold">Port {svc.port}</div>
                                            <div className={`text-xs px-2 py-1 rounded font-bold uppercase ${isOpen ? 'bg-red-500/20 text-red-400' : 'bg-slate-700 text-slate-400'}`}>
                                                {svc.state}
                                            </div>
                                        </div>
                                        <div>
                                            <div className="text-sm font-semibold text-slate-300 uppercase tracking-wide">{svc.service}</div>
                                            <div className="text-sm text-slate-400 mt-1 line-clamp-2" title={svc.version_info}>
                                                {svc.version_info}
                                            </div>
                                        </div>
                                        
                                        {/* NEW: Display CVE Badges */}
                                        {svc.cves && (
                                            <div className="mt-4 pt-3 border-t border-slate-700/50">
                                                <div className="text-[10px] font-bold text-red-400 mb-2 tracking-wider flex items-center">
                                                    <i className="fa-solid fa-bug mr-1.5"></i> KNOWN VULNERABILITIES
                                                </div>
                                                <div className="flex flex-wrap gap-1.5">
                                                    {svc.cves.split(', ').map((cve, i) => (
                                                        cve.includes('CVE-') ? (
                                                            <a 
                                                                key={i} 
                                                                href={`https://nvd.nist.gov/vuln/detail/${cve}`} 
                                                                target="_blank" 
                                                                rel="noopener noreferrer"
                                                                className="text-xs bg-red-500/10 border border-red-500/30 text-red-300 px-2 py-1 rounded hover:bg-red-500/30 hover:text-white transition-colors shadow-sm"
                                                            >
                                                                {cve}
                                                            </a>
                                                        ) : (
                                                            <span key={i} className="text-xs text-slate-400 italic">{cve}</span>
                                                        )
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                        {/* ------------------------- */}
                                        
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            return (
                <div className="max-w-5xl mx-auto">
                    {/* Header Section */}
                    <div className="flex items-center space-x-4 mb-6">
                        <i className="fa-solid fa-shield-halved text-4xl text-blue-500"></i>
                        <div>
                            <h1 className="text-3xl font-bold tracking-tight">SentinelX</h1>
                            <p className="text-slate-400 text-sm">Automated Attack Surface Assessment</p>
                        </div>
                    </div>

                    {/* Navigation Tabs */}
                    <div className="flex border-b border-slate-700 mb-8 space-x-2">
                        <button 
                            className={`px-4 py-3 font-semibold text-sm transition-colors ${activeTab === 'scan' ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-400 hover:text-slate-200'}`}
                            onClick={() => setActiveTab('scan')}
                        >
                            <i className="fa-solid fa-bolt mr-2"></i> New Scan
                        </button>
                        <button 
                            className={`px-4 py-3 font-semibold text-sm transition-colors ${activeTab === 'history' ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-400 hover:text-slate-200'}`}
                            onClick={openHistoryTab}
                        >
                            <i className="fa-solid fa-clock-rotate-left mr-2"></i> Scan History
                        </button>
                    </div>

                    {/* TAB 1: NEW SCAN */}
                    {activeTab === 'scan' && (
                        <div>
                            <div className="glass-panel rounded-xl p-6 shadow-xl">
                                <form onSubmit={handleScan} className="flex space-x-4 mb-4">
                                    <div className="flex-grow">
                                        <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Target IP or Domain</label>
                                        <input 
                                            type="text" 
                                            value={target}
                                            onChange={(e) => setTarget(e.target.value)}
                                            className="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
                                            placeholder="e.g., 192.168.1.1 or scanme.nmap.org"
                                        />
                                    </div>
                                    <div className="flex items-end">
                                        <button 
                                            type="submit" 
                                            disabled={isScanning}
                                            className={`px-8 py-3 rounded-lg font-bold transition-all shadow-lg flex items-center space-x-2
                                                ${isScanning 
                                                    ? 'bg-slate-700 text-slate-400 cursor-not-allowed' 
                                                    : 'bg-blue-600 hover:bg-blue-500 text-white hover:shadow-blue-500/25'}`}
                                        >
                                            {isScanning ? (
                                                <><i className="fa-solid fa-circle-notch fa-spin"></i><span>Scanning...</span></>
                                            ) : (
                                                <><i className="fa-solid fa-bolt"></i><span>Launch Scan</span></>
                                            )}
                                        </button>
                                    </div>
                                </form>
                                {error && <div className="mt-4 text-red-400 text-sm"><i className="fa-solid fa-triangle-exclamation mr-2"></i>{error}</div>}
                            </div>
                            
                            {/* Render current scan results */}
                            {renderResults(results)}
                        </div>
                    )}

                    {/* TAB 2: SCAN HISTORY */}
                    {activeTab === 'history' && (
                        <div className="animate-fade-in-up">
                            <div className="glass-panel rounded-xl p-6 shadow-xl mb-8">
                                <h2 className="text-xl font-bold mb-4 flex items-center">
                                    <i className="fa-solid fa-database text-slate-400 mr-3"></i> Past Scans Database
                                </h2>
                                
                                {isLoadingHistory ? (
                                    <div className="text-center py-12 text-slate-400">
                                        <i className="fa-solid fa-circle-notch fa-spin text-3xl mb-3"></i>
                                        <p>Fetching database records...</p>
                                    </div>
                                ) : history.length === 0 ? (
                                    <div className="text-center py-12 text-slate-500">
                                        <i className="fa-solid fa-folder-open text-4xl mb-3 opacity-50"></i>
                                        <p>No scans found in the database yet.</p>
                                    </div>
                                ) : (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="border-b-2 border-slate-700 text-slate-400 text-xs uppercase tracking-wider">
                                                    <th className="pb-3 pr-4 font-semibold">Date & Time</th>
                                                    <th className="pb-3 pr-4 font-semibold">Target IP</th>
                                                    <th className="pb-3 pr-4 font-semibold">Hostname</th>
                                                    <th className="pb-3 font-semibold text-right">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {history.map(item => (
                                                    <tr key={item.id} className="border-b border-slate-800 hover:bg-slate-800/50 transition-colors group">
                                                        <td className="py-4 pr-4 text-sm text-slate-300">
                                                            {new Date(item.timestamp).toLocaleString()}
                                                        </td>
                                                        <td className="py-4 pr-4 text-sm text-blue-400 font-mono">
                                                            {item.target_ip}
                                                        </td>
                                                        <td className="py-4 pr-4 text-sm text-slate-300">
                                                            {item.hostname || 'Unknown'}
                                                        </td>
                                                        <td className="py-4 text-right">
                                                            <button 
                                                                onClick={() => fetchHistoryDetails(item.id)}
                                                                className="px-4 py-1.5 bg-slate-700 hover:bg-blue-600 rounded-md text-xs font-bold transition-colors shadow-sm"
                                                            >
                                                                View Results
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>

                            {/* Render selected history results */}
                            {renderResults(historyResults)}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
