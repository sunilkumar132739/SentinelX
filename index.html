<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelX | Advanced Threat Surface</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { geminiDark: '#0a0a0b', geminiSidebar: '#131416' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        /* Beautiful Gradient Backgrounds */
        .app-bg { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); }
        .dark .app-bg { background: linear-gradient(135deg, #0a0a0b 0%, #131416 100%); }
        
        /* Modern Glassmorphism */
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); }
        .dark .glass-panel { background: rgba(20, 21, 24, 0.6); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
    </style>
</head>
<body class="app-bg">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [language, setLanguage] = useState('en');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            
            const [token, setToken] = useState(localStorage.getItem('token'));
            const [authMode, setAuthMode] = useState('login');
            const [username, setUsername] = useState(localStorage.getItem('username') || '');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState(null);
            
            const [profileData, setProfileData] = useState(null);

            const [activeTab, setActiveTab] = useState('new');
            const [target, setTarget] = useState('scanme.nmap.org');
            const [scheduleType, setScheduleType] = useState('interval');
            const [scheduleInterval, setScheduleInterval] = useState(60);
            const [scheduleDateTime, setScheduleDateTime] = useState('');
            const [activeSchedules, setActiveSchedules] = useState([]); // Track running tasks

            const [isScanning, setIsScanning] = useState(false);
            const [results, setResults] = useState(null);
            const [alertMsg, setAlertMsg] = useState(null);
            const [history, setHistory] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light');
                } else {
                    document.documentElement.classList.add('light');
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            const getAuthHeaders = () => ({
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            });

            // --- Authentication ---
            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError(null);
                try {
                    if (authMode === 'register') {
                        const res = await fetch('http://localhost:8000/register', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, email, password })
                        });
                        if (!res.ok) throw new Error((await res.json()).detail || "Registration failed.");
                        setAuthMode('login');
                        setAuthError("Registration successful! Please log in.");
                    } else {
                        const formData = new URLSearchParams();
                        formData.append('username', username);
                        formData.append('password', password);
                        const res = await fetch('http://localhost:8000/token', {
                            method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: formData
                        });
                        if (!res.ok) throw new Error("Invalid credentials");
                        const data = await res.json();
                        setToken(data.access_token);
                        localStorage.setItem('token', data.access_token);
                        localStorage.setItem('username', username);
                    }
                } catch (err) { setAuthError(err.message); }
            };

            const handleLogout = () => {
                setToken(null); setProfileData(null);
                localStorage.removeItem('token'); localStorage.removeItem('username');
                setResults(null); setActiveTab('new');
            };

            // --- Data Fetching ---
            const fetchProfile = async () => {
                try {
                    const res = await fetch('http://localhost:8000/users/me', { headers: getAuthHeaders() });
                    if (res.status === 401) return handleLogout();
                    setProfileData(await res.json());
                } catch (err) { console.error("Failed to load profile"); }
            };

            const fetchHistory = async () => {
                const res = await fetch('http://localhost:8000/history', { headers: getAuthHeaders() });
                if (res.status === 401) return handleLogout();
                setHistory(await res.json());
            };

            const fetchSchedules = async () => {
                const res = await fetch('http://localhost:8000/schedules', { headers: getAuthHeaders() });
                if (res.ok) setActiveSchedules(await res.json());
            };

            useEffect(() => { if (token) fetchProfile(); }, [token]);
            
            useEffect(() => { 
                if (token) {
                    if (['history', 'automated', 'search'].includes(activeTab)) fetchHistory();
                    if (activeTab === 'schedule') fetchSchedules();
                }
            }, [activeTab, token]);

            const handleAvatarUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = async () => {
                    try {
                        const res = await fetch('http://localhost:8000/users/me/avatar', {
                            method: 'PUT', headers: getAuthHeaders(), body: JSON.stringify({ avatar_data: reader.result })
                        });
                        if (res.ok) { fetchProfile(); setAlertMsg({ type: 'success', text: "Profile picture updated!" }); }
                    } catch (err) { setAlertMsg({ type: 'error', text: "Upload failed." }); }
                };
                reader.readAsDataURL(file);
            };

            const handleScan = async (e) => {
                e.preventDefault();
                setIsScanning(true); setResults(null); setAlertMsg(null);
                try {
                    const res = await fetch(`http://localhost:8000/scan/${target}`, { headers: getAuthHeaders() });
                    if (res.status === 401) return handleLogout();
                    setResults(await res.json());
                } catch (err) { setAlertMsg({ type: 'error', text: "Scan failed to execute." }); } 
                finally { setIsScanning(false); }
            };

            const handleSchedule = async (e) => {
                e.preventDefault();
                setAlertMsg(null);
                let formattedRunAt = null;
                if (scheduleType === 'datetime') {
                    const match = scheduleDateTime.match(/^(\d{2}):(\d{2}):(\d{4}) (\d{2}):(\d{2}):(\d{2})$/);
                    if (!match) { setAlertMsg({ type: 'error', text: "Invalid format. Use DD:MM:YYYY HH:MM:SS" }); return; }
                    formattedRunAt = `${match[3]}-${match[2]}-${match[1]}T${match[4]}:${match[5]}:${match[6]}`;
                }

                try {
                    const res = await fetch('http://localhost:8000/schedule', {
                        method: 'POST', headers: getAuthHeaders(),
                        body: JSON.stringify({
                            target: target, schedule_type: scheduleType,
                            minutes: scheduleType === 'interval' ? parseInt(scheduleInterval) : null,
                            run_at: formattedRunAt
                        })
                    });
                    if (res.status === 401) return handleLogout();
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail);
                    setAlertMsg({ type: 'success', text: data.message });
                    fetchSchedules(); // Refresh task list immediately
                } catch (err) { setAlertMsg({ type: 'error', text: err.message }); }
            };

            const terminateSchedule = async (jobId) => {
                if(!window.confirm("Terminate this automated task? It will stop running immediately.")) return;
                try {
                    await fetch(`http://localhost:8000/schedules/${jobId}`, { method: 'DELETE', headers: getAuthHeaders() });
                    fetchSchedules();
                    setAlertMsg({ type: 'success', text: "Task terminated successfully." });
                } catch(err) { setAlertMsg({ type: 'error', text: "Failed to terminate task."}); }
            };

            const viewHistoricalScan = async (id) => {
                try {
                    const res = await fetch(`http://localhost:8000/history/${id}`, { headers: getAuthHeaders() });
                    if (res.status === 401) return handleLogout();
                    setResults(await res.json());
                    setActiveTab('new');
                } catch (err) { alert("Failed to fetch historical scan."); }
            };

            const clearAllHistory = async () => {
                if (!window.confirm("WARNING: Are you sure you want to clear ALL history? This action cannot be undone.")) return;
                try {
                    await fetch('http://localhost:8000/history', { method: 'DELETE', headers: getAuthHeaders() });
                    fetchHistory();
                } catch(err) { alert("Failed to clear history"); }
            };
            
            const deleteSingleScan = async (id) => {
                if (!window.confirm("Are you sure you want to delete this scan?")) return;
                try {
                    await fetch(`http://localhost:8000/history/${id}`, { method: 'DELETE', headers: getAuthHeaders() });
                    fetchHistory();
                } catch(err) { alert("Failed to delete scan"); }
            };

            const filteredSearchHistory = useMemo(() => history.filter(h => h.target.toLowerCase().includes(searchQuery.toLowerCase())), [history, searchQuery]);
            const manualHistory = useMemo(() => history.filter(h => h.scan_type !== 'automated'), [history]);
            const automatedHistory = useMemo(() => history.filter(h => h.scan_type === 'automated'), [history]);

            const SidebarIcon = ({ icon, id, title }) => (
                <div onClick={() => setActiveTab(id)} title={title}
                    className={`w-11 h-11 flex items-center justify-center rounded-xl cursor-pointer transition-all duration-300 shadow-sm
                        ${activeTab === id 
                            ? 'bg-gradient-to-br from-blue-500 to-indigo-600 text-white shadow-blue-500/30 font-bold transform scale-105' 
                            : 'text-gray-500 hover:bg-gray-200 dark:text-gray-400 dark:hover:bg-gray-800'}`}
                >
                    <i className={`fa-solid ${icon} text-lg`}></i>
                </div>
            );

            const displayAvatar = profileData?.avatar_data || `https://api.dicebear.com/7.x/initials/svg?seed=${username}&backgroundColor=3b82f6`;

            const getRiskBadge = (level) => {
                switch (level) {
                    case 'LOW': return 'bg-gradient-to-r from-emerald-500 to-green-500 text-white shadow-green-500/30';
                    case 'MEDIUM': return 'bg-gradient-to-r from-amber-400 to-yellow-500 text-white shadow-yellow-500/30';
                    case 'HIGH': return 'bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-orange-500/30';
                    case 'CRITICAL': return 'bg-gradient-to-r from-red-600 to-rose-600 text-white shadow-red-500/30';
                    default: return 'bg-gray-200 text-gray-700';
                }
            };

            if (!token) {
                return (
                    <div className="min-h-screen app-bg flex items-center justify-center p-4">
                        <div className="max-w-md w-full glass-panel p-8 rounded-3xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl"></div>
                            <div className="text-center mb-8 relative z-10">
                                <div className="inline-block p-4 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl shadow-xl shadow-blue-500/20 mb-5">
                                    <i className="fa-solid fa-shield-halved text-4xl text-white"></i>
                                </div>
                                <h1 className="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-indigo-600 tracking-tight">SentinelX</h1>
                                <p className="dark:text-gray-400 text-gray-500 text-sm mt-2 font-medium">Identity Authentication</p>
                            </div>
                            {authError && <div className="bg-red-500/10 border border-red-500/30 text-red-500 p-3 rounded-xl mb-6 text-sm text-center font-medium">{authError}</div>}
                            <form onSubmit={handleAuth} className="space-y-5 relative z-10">
                                <div>
                                    <label className="block text-[11px] uppercase dark:text-gray-400 text-gray-500 mb-1.5 font-bold tracking-wider">Username</label>
                                    <input type="text" value={username} onChange={e => setUsername(e.target.value)} required 
                                        className="w-full bg-white/50 dark:bg-black/20 border border-gray-200 dark:border-gray-800 rounded-xl p-3.5 dark:text-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium" />
                                </div>
                                {authMode === 'register' && (
                                    <div>
                                        <label className="block text-[11px] uppercase dark:text-gray-400 text-gray-500 mb-1.5 font-bold tracking-wider">Email Address</label>
                                        <input type="email" value={email} onChange={e => setEmail(e.target.value)} required 
                                            className="w-full bg-white/50 dark:bg-black/20 border border-gray-200 dark:border-gray-800 rounded-xl p-3.5 dark:text-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium" />
                                    </div>
                                )}
                                <div>
                                    <label className="block text-[11px] uppercase dark:text-gray-400 text-gray-500 mb-1.5 font-bold tracking-wider">Password</label>
                                    <input type="password" value={password} onChange={e => setPassword(e.target.value)} required 
                                        className="w-full bg-white/50 dark:bg-black/20 border border-gray-200 dark:border-gray-800 rounded-xl p-3.5 dark:text-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium" />
                                </div>
                                <button type="submit" className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white py-3.5 rounded-xl font-bold transition-all shadow-lg shadow-blue-500/30 mt-2">
                                    {authMode === 'login' ? 'Secure Login' : 'Create Account'}
                                </button>
                            </form>
                            <div className="text-center mt-8 text-sm dark:text-gray-400 text-gray-600 font-medium">
                                {authMode === 'login' ? "Don't have an account? " : "Already have an account? "}
                                <button onClick={() => {setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(null);}} className="text-blue-500 hover:text-indigo-400 transition-colors font-bold">
                                    {authMode === 'login' ? 'Register' : 'Login'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen app-bg text-gray-900 dark:text-gray-100 transition-colors duration-300">
                    
                    {/* Darker Sidebar with gradient glow */}
                    <div className="w-[80px] h-full flex flex-col justify-between items-center py-6 glass-panel border-r-0 border-l-0 border-y-0 shadow-[4px_0_24px_rgba(0,0,0,0.02)] dark:shadow-[4px_0_24px_rgba(0,0,0,0.2)] z-10 shrink-0">
                        <div className="flex flex-col items-center space-y-5">
                            <div className="w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center text-white mb-6 shadow-xl shadow-blue-500/30">
                                <i className="fa-solid fa-shield-halved text-xl"></i>
                            </div>
                            <SidebarIcon id="new" icon="fa-plus" title="New Scan" />
                            <SidebarIcon id="search" icon="fa-magnifying-glass" title="Search Scans" />
                            <SidebarIcon id="schedule" icon="fa-calendar-plus" title="Schedule Scan" />
                            <SidebarIcon id="automated" icon="fa-robot" title="Automated Results" />
                            <SidebarIcon id="history" icon="fa-clock-rotate-left" title="Manual History" />
                        </div>

                        <div className="flex flex-col items-center space-y-6">
                            <div onClick={() => setIsSettingsOpen(true)} title="Settings" className="w-11 h-11 flex items-center justify-center rounded-xl cursor-pointer text-gray-500 hover:bg-gray-200 dark:text-gray-400 dark:hover:bg-gray-800 transition-all">
                                <i className="fa-solid fa-gear text-lg"></i>
                            </div>
                            <div title="My Profile" onClick={() => setActiveTab('profile')} className={`cursor-pointer w-12 h-12 flex items-center justify-center rounded-xl transition-all ${activeTab === 'profile' ? 'bg-gradient-to-br from-blue-500/20 to-indigo-500/20' : ''}`}>
                                <img src={displayAvatar} alt="Profile" className="w-10 h-10 rounded-full ring-2 ring-transparent hover:ring-blue-500 transition-all shadow-md object-cover" />
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-6 md:p-10 relative">
                        {/* Background Decorators */}
                        <div className="absolute top-0 right-0 w-96 h-96 bg-blue-500/5 rounded-full blur-3xl -z-10 pointer-events-none"></div>
                        <div className="absolute bottom-0 left-1/2 w-96 h-96 bg-purple-500/5 rounded-full blur-3xl -z-10 pointer-events-none"></div>

                        <div className="max-w-4xl mx-auto w-full relative z-10">
                            
                            {activeTab !== 'profile' && (
                                <div className="mb-10 animate-fade-in-up">
                                    <h1 className="text-3xl md:text-5xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500 mb-2 tracking-tight">
                                        Hello, {username}
                                    </h1>
                                    <p className="text-gray-500 dark:text-gray-400 text-sm font-medium">
                                        {language === 'hi' ? 'Aaj aapka system kaisa chal raha hai?' : 'How can I help you secure your network today?'}
                                    </p>
                                </div>
                            )}

                            {alertMsg && (
                                <div className={`p-4 mb-6 rounded-xl border text-sm font-bold shadow-lg flex items-center ${alertMsg.type === 'success' ? 'bg-green-50/80 dark:bg-green-500/10 text-green-700 dark:text-green-400 border-green-200 dark:border-green-500/30' : 'bg-red-50/80 dark:bg-red-500/10 text-red-700 dark:text-red-400 border-red-200 dark:border-red-500/30'}`}>
                                    <i className={`fa-solid mr-3 ${alertMsg.type === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation'} text-lg`}></i>
                                    {alertMsg.text}
                                </div>
                            )}

                            {/* --- TAB: PROFILE --- */}
                            {activeTab === 'profile' && (
                                <div className="animate-fade-in-up max-w-2xl mx-auto mt-8">
                                    <div className="glass-panel rounded-3xl shadow-xl overflow-hidden border border-white/40 dark:border-gray-800">
                                        <div className="h-36 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 relative overflow-hidden">
                                            <div className="absolute inset-0 bg-black/10"></div>
                                        </div>
                                        <div className="px-8 pb-8 relative">
                                            <div className="absolute -top-16 border-4 border-white dark:border-[#131416] rounded-full bg-white group cursor-pointer w-32 h-32 shadow-xl">
                                                <img src={displayAvatar} alt="Profile" className="w-full h-full rounded-full object-cover" />
                                                <label className="absolute inset-0 bg-black/60 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 cursor-pointer text-white text-3xl">
                                                    <i className="fa-solid fa-camera mb-1"></i>
                                                    <input type="file" accept="image/*" className="hidden" onChange={handleAvatarUpload} />
                                                </label>
                                            </div>
                                            
                                            <div className="pt-20">
                                                <h2 className="text-3xl font-extrabold tracking-tight dark:text-white text-gray-900">{profileData?.username || username}</h2>
                                                <p className="text-gray-500 dark:text-gray-400 font-bold mb-6 uppercase text-xs tracking-wider mt-1">Security Analyst / User</p>
                                                
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                                                    <div className="bg-white/50 dark:bg-black/20 border border-gray-200 dark:border-gray-800 p-5 rounded-2xl">
                                                        <div className="text-[10px] uppercase font-extrabold text-gray-500 dark:text-gray-400 mb-1 tracking-widest">Email Address</div>
                                                        <div className="font-bold text-gray-900 dark:text-gray-200">{profileData?.email || 'Loading...'}</div>
                                                    </div>
                                                    <div className="bg-white/50 dark:bg-black/20 border border-gray-200 dark:border-gray-800 p-5 rounded-2xl">
                                                        <div className="text-[10px] uppercase font-extrabold text-gray-500 dark:text-gray-400 mb-1 tracking-widest">Total Scans Performed</div>
                                                        <div className="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-indigo-500 text-lg">{profileData?.total_scans !== undefined ? profileData.total_scans : '...'} Scans</div>
                                                    </div>
                                                </div>

                                                <div className="border-t border-gray-200 dark:border-gray-800 pt-6 flex justify-end">
                                                    <button onClick={handleLogout} className="flex items-center px-6 py-3 bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 text-white rounded-xl font-bold transition-all shadow-lg shadow-red-500/30">
                                                        <i className="fa-solid fa-right-from-bracket mr-3"></i>Sign Out
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --- TAB: NEW SCAN --- */}
                            {activeTab === 'new' && (
                                <div className="space-y-8">
                                    <div className="glass-panel p-6 md:p-8 rounded-3xl shadow-xl">
                                        <h3 className="text-xl font-extrabold mb-6 flex items-center tracking-tight"><i className="fa-solid fa-crosshairs mr-3 text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-indigo-500"></i><span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-indigo-500">Target Acquisition</span></h3>
                                        <form onSubmit={handleScan} className="flex flex-col md:flex-row gap-4">
                                            <input type="text" value={target} onChange={(e) => setTarget(e.target.value)} placeholder="Enter IP or Domain (e.g. scanme.nmap.org)" 
                                                className="flex-grow bg-white/50 dark:bg-black/20 border border-gray-200 dark:border-gray-800 rounded-xl p-4 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-bold placeholder-gray-400" />
                                            <button type="submit" disabled={isScanning} className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white px-8 py-4 rounded-xl font-bold transition-all shadow-lg shadow-blue-500/30 whitespace-nowrap">
                                                {isScanning ? <><i className="fa-solid fa-spinner fa-spin mr-2"></i>Scanning...</> : "Launch Scan"}
                                            </button>
                                        </form>
                                    </div>

                                    {results && (
                                        <div className="animate-fade-in-up space-y-6">
                                            <div className="flex justify-between items-end pb-2 border-b border-gray-200 dark:border-gray-800">
                                                <h2 className="text-2xl font-extrabold tracking-tight">Results for <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">{results.target_ip}</span></h2>
                                                <button onClick={() => window.open(`http://localhost:8000/scans/${results.scan_id}/pdf`, '_blank')} className="flex items-center px-5 py-2.5 bg-gradient-to-r from-gray-100 to-gray-200 dark:from-gray-800 dark:to-gray-700 hover:scale-105 rounded-xl text-sm font-bold transition-all shadow-md">
                                                    <i className="fa-solid fa-file-pdf mr-2 text-red-500"></i>Export PDF
                                                </button>
                                            </div>

                                            {results.risk_metrics && (
                                                <div className="glass-panel p-6 rounded-3xl shadow-lg border border-white/40 dark:border-gray-800">
                                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                                                        <div>

                                            <div className="text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-widest mt-1">Toggle interface</div>
                                        </div>
                                        <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-16 h-8 bg-gray-300 dark:bg-blue-600 rounded-full p-1 transition-colors duration-300 relative flex items-center shadow-inner">
                                            <div className={`w-6 h-6 bg-white rounded-full shadow-md transform transition-transform duration-300 flex justify-center items-center ${isDarkMode ? 'translate-x-8' : 'translate-x-0'}`}>
                                                <i className={`fa-solid text-[10px] ${isDarkMode ? 'fa-moon text-blue-600' : 'fa-sun text-yellow-500'}`}></i>
                                            </div>
                                        </button>
                                    </div>
                                    <div className="bg-gray-50 dark:bg-black/20 p-4 rounded-2xl border border-gray-100 dark:border-gray-800/50">
                                        <label className="font-bold text-gray-900 dark:text-white block mb-2 text-sm">Display Language</label>
                                        <select value={language} onChange={(e) => setLanguage(e.target.value)} className="w-full bg-white dark:bg-[#131416] border border-gray-200 dark:border-gray-700 rounded-xl p-3.5 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold">
                                            <option value="en">English (US)</option>
                                            <option value="hi">Hinglish</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="p-5 bg-gray-50 dark:bg-black/40 text-right">
                                    <button onClick={() => setIsSettingsOpen(false)} className="px-8 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 hover:scale-105 transition-transform">Done</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
