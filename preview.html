<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphism Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Core Neumorphic Base Color */
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #2a2d34; /* Soft Dark Matte Gray */
            color: #d1d5db; 
            overflow-x: hidden;
        }
        
        /* 1. Flat Extruded Surface (Cards & Panels) */
        .neo-flat {
            background: #2a2d34;
            box-shadow: 10px 10px 20px #1b1d22, 
                       -10px -10px 20px #393d46;
        }
        
        /* 2. Pressed Surface (Input fields, Tracks, Sidebar backgrounds) */
        .neo-pressed {
            background: #2a2d34;
            box-shadow: inset 8px 8px 16px #1b1d22, 
                        inset -8px -8px 16px #393d46;
        }

        /* 3. Interactive Buttons */
        .neo-btn {
            background: #2a2d34;
            box-shadow: 6px 6px 12px #1b1d22, 
                       -6px -6px 12px #393d46;
            transition: all 0.2s ease-in-out;
        }
        
        /* Button Hover (Softly pushes down) */
        .neo-btn:hover {
            box-shadow: 3px 3px 6px #1b1d22, 
                       -3px -3px 6px #393d46;
        }
        
        /* Button Active (Presses into the surface) */
        .neo-btn:active {
            box-shadow: inset 4px 4px 8px #1b1d22, 
                        inset -4px -4px 8px #393d46;
            color: #3b82f6; /* Blue glow when pressed */
        }

        /* Accent Colors */
        .text-accent { color: #3b82f6; }
        .text-danger { color: #ef4444; }
    </style>
</head>
<body class="h-screen w-screen flex justify-center items-center">

    <!-- Main Neumorphic Container -->
    <div class="z-10 w-full max-w-5xl h-[80vh] neo-flat rounded-[2.5rem] p-8 flex gap-8">
        
        <!-- Sidebar (Pressed into the surface) -->
        <div class="w-24 h-full neo-pressed rounded-3xl flex flex-col items-center py-8 gap-8 border border-gray-700/20">
            <!-- App Icon (Extruded) -->
            <div class="w-12 h-12 neo-flat rounded-xl flex items-center justify-center text-accent">
                <i class="fa-solid fa-shield-halved text-xl"></i>
            </div>
            
            <!-- Navigation Buttons -->
            <div class="w-12 h-12 flex items-center justify-center rounded-xl cursor-pointer neo-btn text-gray-500 hover:text-gray-300"><i class="fa-solid fa-plus text-lg"></i></div>
            <div class="w-12 h-12 flex items-center justify-center rounded-xl cursor-pointer neo-pressed text-accent"><i class="fa-solid fa-robot text-lg"></i></div>
            <div class="w-12 h-12 flex items-center justify-center rounded-xl cursor-pointer neo-btn text-gray-500 hover:text-gray-300"><i class="fa-solid fa-chart-pie text-lg"></i></div>
            
            <!-- Avatar (Extruded border) -->
            <div class="mt-auto w-12 h-12 neo-flat rounded-full p-1">
                <img src="https://api.dicebear.com/7.x/initials/svg?seed=Admin&backgroundColor=3b82f6" class="w-full h-full rounded-full" />
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col gap-6">
            <h1 class="text-3xl font-extrabold tracking-tight text-gray-100">System <span class="text-accent">Overview</span></h1>
            
            <!-- Score Card (Extruded) -->
            <div class="w-full neo-flat rounded-3xl p-8 flex justify-between items-center">
                <div>
                    <p class="text-gray-500 font-bold uppercase tracking-widest text-xs mb-3">Security Posture</p>
                    <div class="flex items-baseline gap-2">
                        <span class="text-7xl font-extrabold font-mono text-gray-100">84</span>
                        <span class="text-xl text-gray-500 font-bold">/ 100</span>
                    </div>
                </div>
                
                <!-- Circular Progress Ring (Neumorphic style) -->
                <div class="relative w-32 h-32 neo-pressed rounded-full flex items-center justify-center">
                    <div class="w-24 h-24 neo-flat rounded-full flex items-center justify-center">
                        <span class="font-bold text-accent">GOOD</span>
                    </div>
                </div>
            </div>

            <!-- Mini Cards Grid -->
            <div class="grid grid-cols-2 gap-6 mt-2">
                <!-- Card 1 -->
                <div class="neo-flat rounded-3xl p-6 transition-all">
                    <div class="flex justify-between items-center mb-5">
                        <span class="neo-pressed text-accent w-10 h-10 flex items-center justify-center rounded-full"><i class="fa-solid fa-server"></i></span>
                        <span class="text-gray-500 text-xs font-mono font-bold uppercase tracking-widest">Port 22</span>
                    </div>
                    <h3 class="font-bold text-lg text-gray-200">OpenSSH</h3>
                    <p class="text-gray-500 font-semibold text-xs mt-1">Version 8.2p1</p>
                </div>

                <!-- Card 2 -->
                <div class="neo-flat rounded-3xl p-6 transition-all">
                    <div class="flex justify-between items-center mb-5">
                        <span class="neo-pressed text-danger w-10 h-10 flex items-center justify-center rounded-full"><i class="fa-solid fa-globe"></i></span>
                        <span class="text-gray-500 text-xs font-mono font-bold uppercase tracking-widest">Port 80</span>
                    </div>
                    <h3 class="font-bold text-lg text-gray-200">Nginx HTTP</h3>
                    <div class="mt-3 text-[10px] neo-pressed text-danger px-3 py-1.5 rounded-lg inline-block font-bold tracking-wide">2 CVEs DETECTED</div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
