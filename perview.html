<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0a0a0f; overflow-x: hidden; }
        
        /* The Heavy Glass Effect */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        /* Thin highlight for the top edge to simulate light hitting glass */
        .glass-highlight {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Animated floating orbs */
        @keyframes float1 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(50px, 50px) scale(1.2); } 100% { transform: translate(0, 0) scale(1); } }
        @keyframes float2 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-50px, -50px) scale(1.1); } 100% { transform: translate(0, 0) scale(1); } }
        
        .orb-1 { animation: float1 10s infinite ease-in-out; }
        .orb-2 { animation: float2 12s infinite ease-in-out; }
    </style>
</head>
<body class="text-white h-screen w-screen flex justify-center items-center relative">

    <!-- Glowing Background Orbs -->
    <div class="absolute top-10 left-20 w-96 h-96 bg-blue-600 rounded-full mix-blend-screen filter blur-[120px] opacity-70 orb-1 z-0"></div>
    <div class="absolute bottom-10 right-20 w-96 h-96 bg-purple-600 rounded-full mix-blend-screen filter blur-[120px] opacity-70 orb-2 z-0"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-900 rounded-full mix-blend-screen filter blur-[150px] opacity-50 z-0"></div>

    <!-- Main Glass UI Container -->
    <div class="z-10 w-full max-w-5xl h-[80vh] glass glass-highlight rounded-[2.5rem] p-8 flex gap-8">
        
        <!-- Sidebar (Glass inside Glass) -->
        <div class="w-24 h-full glass rounded-3xl flex flex-col items-center py-8 gap-8 border border-white/5 bg-white/5">
            <div class="w-12 h-12 bg-gradient-to-br from-blue-400 to-purple-600 rounded-xl flex items-center justify-center shadow-[0_0_20px_rgba(59,130,246,0.5)]">
                <i class="fa-solid fa-shield-halved text-xl"></i>
            </div>
            <div class="w-12 h-12 flex items-center justify-center text-white/50 hover:text-white hover:bg-white/10 rounded-xl transition-all cursor-pointer"><i class="fa-solid fa-plus text-xl"></i></div>
            <div class="w-12 h-12 flex items-center justify-center text-blue-400 bg-blue-400/10 rounded-xl transition-all cursor-pointer shadow-[inset_0_1px_1px_rgba(255,255,255,0.2)]"><i class="fa-solid fa-robot text-xl"></i></div>
            <div class="w-12 h-12 flex items-center justify-center text-white/50 hover:text-white hover:bg-white/10 rounded-xl transition-all cursor-pointer"><i class="fa-solid fa-chart-pie text-xl"></i></div>
            <div class="mt-auto w-12 h-12 rounded-full border-2 border-purple-500 p-0.5"><img src="https://api.dicebear.com/7.x/initials/svg?seed=Admin&backgroundColor=3b82f6" class="w-full h-full rounded-full" /></div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col gap-6">
            <h1 class="text-4xl font-extrabold tracking-tight">System <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Overview</span></h1>
            
            <!-- Score Card -->
            <div class="w-full glass glass-highlight rounded-3xl p-8 flex justify-between items-center bg-gradient-to-br from-white/5 to-transparent relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-blue-500/20 blur-2xl rounded-full"></div>
                <div>
                    <p class="text-white/50 font-bold uppercase tracking-widest text-xs mb-2">Security Posture</p>
                    <div class="flex items-baseline gap-2">
                        <span class="text-7xl font-extrabold font-mono text-transparent bg-clip-text bg-gradient-to-b from-white to-white/50">84</span>
                        <span class="text-xl text-white/40">/ 100</span>
                    </div>
                </div>
                <div class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-6 py-2 rounded-full font-bold uppercase tracking-wider text-sm shadow-[0_0_15px_rgba(16,185,129,0.2)]">
                    Medium Risk
                </div>
            </div>

            <!-- Mini Cards Grid -->
            <div class="grid grid-cols-2 gap-6">
                <div class="glass rounded-3xl p-6 border border-white/5 hover:bg-white/5 transition-all cursor-pointer relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-br from-purple-500/0 via-purple-500/0 to-purple-500/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-purple-400 bg-purple-400/10 w-10 h-10 flex items-center justify-center rounded-xl"><i class="fa-solid fa-server"></i></span>
                        <span class="text-white/40 text-sm font-mono border border-white/10 px-2 py-1 rounded-md">Port 22</span>
                    </div>
                    <h3 class="font-bold text-lg">OpenSSH</h3>
                    <p class="text-white/50 text-xs mt-1">Version 8.2p1</p>
                </div>

                <div class="glass rounded-3xl p-6 border border-white/5 hover:bg-white/5 transition-all cursor-pointer relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-br from-rose-500/0 via-rose-500/0 to-rose-500/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-rose-400 bg-rose-400/10 w-10 h-10 flex items-center justify-center rounded-xl"><i class="fa-solid fa-globe"></i></span>
                        <span class="text-white/40 text-sm font-mono border border-white/10 px-2 py-1 rounded-md">Port 80</span>
                    </div>
                    <h3 class="font-bold text-lg">Nginx HTTP</h3>
                    <div class="mt-2 text-[10px] bg-rose-500/20 text-rose-300 px-2 py-1 rounded inline-block font-bold">2 CVEs DETECTED</div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
